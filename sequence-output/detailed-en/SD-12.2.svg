" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Streak information retrieval</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">User_Streak</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">Reward milestone configuration</tspan></text><path d="M25,1975L2820,1975" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="2115" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="1845" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="1595" fill="white" stroke="black"/><rect x="1769" y="762" width="12" height="1345" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.2 View login streak</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-27 NF1–6, A1; BR108–109; §5.2.5</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: valid session, required role, active Student account; JWT authentication under Section 5.2.1. BR109: viewing neither updates the streak nor grants coins. UC-27 uses &apos;login streak&apos;; BR108 uses &apos;learning streak&apos;.</tspan></text><rect x="2179" y="895" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1105" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="1324" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1420" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1440" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1422" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1441" text-anchor="start" font-size="15"><tspan x="135" dy="0">[a next reward milestone is available]</tspan></text><rect x="125" y="1980" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="1999" text-anchor="start" font-size="15"><tspan x="133" dy="0">[no next reward milestone is available — A1]</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select Login Streak</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="48" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve the Student&apos;s streak</tspan><tspan x="750" dy="20">information</tspan></text><path d="M552,520L948,520" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="585" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="604" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,645L1358,645" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="710" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="729" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve the Student&apos;s streak</tspan><tspan x="1570" dy="20">information</tspan></text><path d="M1372,770L1768,770" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="835" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="854" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">5: Retrieve the current and longest</tspan><tspan x="1980" dy="20">streaks</tspan></text><path d="M1782,895L2178,895" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="960" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="979" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Current streak; longest streak</tspan></text><path d="M2178,1000L1782,1000" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1065" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1084" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">7: Retrieve configured streak reward milestones</tspan></text><path d="M1782,1105L2588,1105" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1170" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1189" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: Target day counts and corresponding coin rewards</tspan></text><path d="M2588,1210L1782,1210" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="1275" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="1294" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Identify the next reward</tspan><tspan x="1899" dy="20">milestone from the current</tspan><tspan x="1899" dy="20">streak</tspan></text><path d="M1782,1329h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1475" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1494" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Current streak, longest streak, next</tspan><tspan x="1570" dy="20">milestone, configured coins</tspan></text><path d="M1768,1535L1372,1535" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1600" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1619" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: Current streak, longest streak, next</tspan><tspan x="1160" dy="20">milestone, configured coins</tspan></text><path d="M1358,1660L962,1660" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1725" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1744" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Current streak, longest streak, next</tspan><tspan x="750" dy="20">milestone, configured coins</tspan></text><path d="M948,1785L552,1785" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1850" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1869" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: Display current streak, longest</tspan><tspan x="340" dy="20">streak, next milestone and its coin reward</tspan></text><path d="M538,1910L142,1910" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2031" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2050" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">14: Current / longest streak; no next</tspan><tspan x="1570" dy="20">milestone</tspan></text><path d="M1768,2091L1372,2091" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2156" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2175" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">15: Current / longest streak; no next</tspan><tspan x="1160" dy="20">milestone</tspan></text><path d="M1358,2216L962,2216" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2281" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2300" text-anchor="middle" font-size="15"><tspan x="750" dy="0">16: Current / longest streak; no next</tspan><tspan x="750" dy="20">milestone</tspan></text><path d="M948,2341L552,2341" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2406" width="378" height="68" fill="white" stroke="none"/><text x="340" y="2425" text-anchor="middle" font-size="15"><tspan x="340" dy="0">17: Display current and longest streaks;</tspan><tspan x="340" dy="20">indicate that no next milestone is</tspan><tspan x="340" dy="20">available</tspan></text><path d="M538,2486L142,2486" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>