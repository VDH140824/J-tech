<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="4336" viewBox="0 0 2845 4336"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4281" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1940" width="2795" height="2086" fill="none" stroke="black"/><rect x="39" y="2995" width="2767" height="986" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Content feedback list</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Academic feedback retrieval</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">course / lesson</tspan></text><path d="M39,3470L2806,3470" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="4181" width="2745" height="50" fill="white" stroke="black"/><rect x="539" y="387" width="12" height="3745" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="3300" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="3070" fill="white" stroke="black"/><rect x="1769" y="722" width="12" height="2860" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.1 View content feedback list</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-48 NF1–7, A5a; BR113; §5.2.3</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Precondition: authenticated Moderator with the required privileges. Read-only. UC-48 status filters: Pending / In Progress / Resolved / Rejected.</tspan></text><rect x="1781" y="864" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1040" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1250" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1940" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1960" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="1942" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1961" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Moderator changes search / filter criteria]</tspan></text><rect x="551" y="2149" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2669" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="2825" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="2995" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3015" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="2997" width="2647" height="28" fill="white" stroke="none"/><text x="149" y="3016" text-anchor="start" font-size="15"><tspan x="149" dy="0">[matching results exist]</tspan></text><rect x="139" y="3475" width="2647" height="28" fill="white" stroke="none"/><text x="147" y="3494" text-anchor="start" font-size="15"><tspan x="147" dy="0">[no matching records are found — A5a]</tspan></text><rect x="50" y="4181" width="75" height="28" fill="white" stroke="black"/><text x="58" y="4200" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="4185" width="2635" height="28" fill="white" stroke="none"/><text x="148" y="4204" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-17.2 — View content feedback detail</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select Content Feedback</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve the content feedback list</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="690" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="709" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve the content feedback list</tspan></text><path d="M1372,730L1768,730" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="795" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="814" text-anchor="start" font-size="15"><tspan x="1899" dy="0">5: Restrict results to</tspan><tspan x="1899" dy="20">academic content: lectures /</tspan><tspan x="1899" dy="20">questions / pedagogical</tspan><tspan x="1899" dy="20">materials</tspan></text><path d="M1782,869h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="960" width="378" height="68" fill="white" stroke="none"/><text x="1980" y="979" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Retrieve all content tickets,</tspan><tspan x="1980" dy="20">prioritizing Pending items and newest</tspan><tspan x="1980" dy="20">submissions first</tspan></text><path d="M1782,1040L2178,1040" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1105" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1124" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: Content feedback list</tspan></text><path d="M2178,1145L1782,1145" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1210" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1229" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: Retrieve course / lesson context for the list and filters</tspan></text><path d="M1782,1250L2588,1250" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1315" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1334" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">9: Related course / lesson information</tspan></text><path d="M2588,1355L1782,1355" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1420" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1439" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Content feedback list and filter</tspan><tspan x="1570" dy="20">options</tspan></text><path d="M1768,1480L1372,1480" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1545" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1564" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: Content feedback list and filter</tspan><tspan x="1160" dy="20">options</tspan></text><path d="M1358,1605L962,1605" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1670" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1689" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Content feedback list and filter</tspan><tspan x="750" dy="20">options</tspan></text><path d="M948,1730L552,1730" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1795" width="378" height="68" fill="white" stroke="none"/><text x="340" y="1814" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: Display ID, course, lesson, content</tspan><tspan x="340" dy="20">type, title, submitter, submission date</tspan><tspan x="340" dy="20">and status</tspan></text><path d="M538,1875L142,1875" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1995" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2014" text-anchor="middle" font-size="15"><tspan x="340" dy="0">14: Filter by course / lesson / status, or</tspan><tspan x="340" dy="20">enter keywords and press Enter</tspan></text><path d="M142,2055L538,2055" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="2120" width="275" height="48" fill="white" stroke="none"/><text x="669" y="2139" text-anchor="start" font-size="15"><tspan x="669" dy="0">15: Trim search keywords under</tspan><tspan x="669" dy="20">Section 5.2.2</tspan></text><path d="M552,2154h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="2245" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2264" text-anchor="middle" font-size="15"><tspan x="750" dy="0">16: Search using filters, keywords and</tspan><tspan x="750" dy="20">pagination</tspan></text><path d="M552,2305L948,2305" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2370" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2389" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">17: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,2430L1358,2430" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2495" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2514" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">18: Search using filters, keywords and</tspan><tspan x="1570" dy="20">pagination</tspan></text><path d="M1372,2555L1768,2555" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2620" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2639" text-anchor="start" font-size="15"><tspan x="1899" dy="0">19: Search academic feedback</tspan><tspan x="1899" dy="20">only; match title / Student</tspan><tspan x="1899" dy="20">name / content code</tspan></text><path d="M1782,2674h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2765" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2784" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">20: Query tickets matching the selected</tspan><tspan x="1980" dy="20">criteria</tspan></text><path d="M1782,2825L2178,2825" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2890" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2909" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">21: Matching feedback tickets</tspan></text><path d="M2178,2930L1782,2930" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3050" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3069" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">22: Filtered feedback list</tspan></text><path d="M1768,3090L1372,3090" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3155" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3174" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">23: Filtered feedback list</tspan></text><path d="M1358,3195L962,3195" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3260" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3279" text-anchor="middle" font-size="15"><tspan x="750" dy="0">24: Filtered feedback list</tspan></text><path d="M948,3300L552,3300" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3365" width="378" height="28" fill="white" stroke="none"/><text x="340" y="3384" text-anchor="middle" font-size="15"><tspan x="340" dy="0">25: Refresh the data table</tspan></text><path d="M538,3405L142,3405" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3526" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3545" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">26: No matching results</tspan></text><path d="M1768,3566L1372,3566" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3631" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3650" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">27: No matching results</tspan></text><path d="M1358,3671L962,3671" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3736" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3755" text-anchor="middle" font-size="15"><tspan x="750" dy="0">28: No matching results</tspan></text><path d="M948,3776L552,3776" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3841" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3860" text-anchor="middle" font-size="15"><tspan x="340" dy="0">29: Display that no content feedback</tspan><tspan x="340" dy="20">matches the search criteria</tspan></text><path d="M538,3901L142,3901" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="4056" width="378" height="48" fill="white" stroke="none"/><text x="340" y="4075" text-anchor="middle" font-size="15"><tspan x="340" dy="0">30: Select View Details on a feedback</tspan><tspan x="340" dy="20">ticket</tspan></text><path d="M142,4116L538,4116" fill="none" stroke="black"  marker-end="url(#block)"/></g></svg>