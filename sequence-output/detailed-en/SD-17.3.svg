<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4391" viewBox="0 0 3255 4391"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4336" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="750" width="3205" height="195" fill="none" stroke="black"/><rect x="25" y="1620" width="3205" height="490" fill="none" stroke="black"/><rect x="25" y="2305" width="3205" height="1981" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Content feedback processing</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Feedback validation and update</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">notification</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">Email Service</tspan></text><path d="M25,3045L3230,3045" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3815" fill="white" stroke="black"/><rect x="949" y="1027" width="12" height="2945" fill="white" stroke="black"/><rect x="1359" y="1152" width="12" height="2695" fill="white" stroke="black"/><rect x="1769" y="1402" width="12" height="2320" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.3 Process content feedback</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-50 NF1–9, A3a, A4a; BR115, BR144–145</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: authenticated Moderator; ticket status is Pending / In Progress. UC-50 does not specify an email failure path; UC-64&apos;s email failure handling is not applied here.</tspan></text><rect x="551" y="654" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="750" width="90" height="30" fill="white" stroke="black"/><text x="33" y="770" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="752" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="771" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Resolved / Rejected is selected with blank notes — A3a]</tspan></text><rect x="1371" y="1274" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="1524" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1620" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1640" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="1622" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="1641" text-anchor="start" font-size="15"><tspan x="135" dy="0">[validation constraints are violated — NF5 / A3a]</tspan></text><rect x="25" y="2305" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2325" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2307" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="2326" text-anchor="start" font-size="15"><tspan x="135" dy="0">[another Moderator has just updated the ticket — A4a]</tspan></text><rect x="2179" y="2240" width="12" height="160" fill="white" stroke="black"/><rect x="125" y="3050" width="3085" height="28" fill="white" stroke="none"/><text x="133" y="3069" text-anchor="start" font-size="15"><tspan x="133" dy="0">[the update succeeds]</tspan></text><rect x="2589" y="3266" width="12" height="105" fill="white" stroke="black"/><rect x="2999" y="3476" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="4070" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Review the issue and select In Progress</tspan><tspan x="340" dy="20">/ Resolved / Rejected</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="480" width="378" height="48" fill="white" stroke="none"/><text x="340" y="499" text-anchor="middle" font-size="15"><tspan x="340" dy="0">2: Enter Resolution Notes and click</tspan><tspan x="340" dy="20">Confirm Processing</tspan></text><path d="M142,540L538,540" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="605" width="275" height="68" fill="white" stroke="none"/><text x="669" y="624" text-anchor="start" font-size="15"><tspan x="669" dy="0">3: Trim and validate</tspan><tspan x="669" dy="20">client-side input — Section</tspan><tspan x="669" dy="20">5.2.2</tspan></text><path d="M552,659h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="805" width="378" height="48" fill="white" stroke="none"/><text x="340" y="824" text-anchor="middle" font-size="15"><tspan x="340" dy="0">4: Highlight the notes field; require</tspan><tspan x="340" dy="20">detailed resolution notes and stop saving</tspan></text><path d="M538,865L142,865" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="975" width="378" height="48" fill="white" stroke="none"/><text x="750" y="994" text-anchor="middle" font-size="15"><tspan x="750" dy="0">5: Submit the new status and resolution</tspan><tspan x="750" dy="20">notes</tspan></text><path d="M552,1035L948,1035" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="1100" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1119" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">6: Forward the request with the Moderator</tspan><tspan x="1160" dy="20">session</tspan></text><path d="M962,1160L1358,1160" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="1225" width="275" height="68" fill="white" stroke="none"/><text x="1489" y="1244" text-anchor="start" font-size="15"><tspan x="1489" dy="0">7: Validate / sanitize</tspan><tspan x="1489" dy="20">server-side input — Section</tspan><tspan x="1489" dy="20">5.2.2</tspan></text><path d="M1372,1279h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1370" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1389" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">8: Process the content feedback update</tspan></text><path d="M1372,1410L1768,1410" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="1475" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="1494" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Validate the status</tspan><tspan x="1899" dy="20">transition and mandatory notes</tspan><tspan x="1899" dy="20">for completion / rejection</tspan></text><path d="M1782,1529h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1675" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1694" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Request correction without saving</tspan></text><path d="M1768,1715L1372,1715" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1780" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1799" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: Request correction without saving</tspan></text><path d="M1358,1820L962,1820" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1885" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1904" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Request correction without saving</tspan></text><path d="M948,1925L552,1925" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1990" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2009" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: Request correction without saving</tspan></text><path d="M538,2030L142,2030" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="2140" width="378" height="88" fill="white" stroke="none"/><text x="1980" y="2159" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">14: Update with optimistic locking:</tspan><tspan x="1980" dy="20">status, notes, resolver Moderator ID,</tspan><tspan x="1980" dy="20">completion timestamp; retain processing</tspan><tspan x="1980" dy="20">history</tspan></text><path d="M1782,2240L2178,2240" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2360" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2379" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">15: Concurrent update conflict</tspan></text><path d="M2178,2400L1782,2400" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2465" width="378" height="68" fill="white" stroke="none"/><text x="1570" y="2484" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">16: Prevent overwriting; notify that</tspan><tspan x="1570" dy="20">another Moderator updated the ticket and</tspan><tspan x="1570" dy="20">request a reload</tspan></text><path d="M1768,2545L1372,2545" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2610" width="378" height="68" fill="white" stroke="none"/><text x="1160" y="2629" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">17: Prevent overwriting; notify that</tspan><tspan x="1160" dy="20">another Moderator updated the ticket and</tspan><tspan x="1160" dy="20">request a reload</tspan></text><path d="M1358,2690L962,2690" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2755" width="378" height="68" fill="white" stroke="none"/><text x="750" y="2774" text-anchor="middle" font-size="15"><tspan x="750" dy="0">18: Prevent overwriting; notify that</tspan><tspan x="750" dy="20">another Moderator updated the ticket and</tspan><tspan x="750" dy="20">request a reload</tspan></text><path d="M948,2835L552,2835" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2900" width="378" height="68" fill="white" stroke="none"/><text x="340" y="2919" text-anchor="middle" font-size="15"><tspan x="340" dy="0">19: Prevent overwriting; notify that</tspan><tspan x="340" dy="20">another Moderator updated the ticket and</tspan><tspan x="340" dy="20">request a reload</tspan></text><path d="M538,2980L142,2980" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="3101" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="3120" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">20: Status, notes, resolver, timestamp and</tspan><tspan x="1980" dy="20">history stored</tspan></text><path d="M2178,3161L1782,3161" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="3226" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3245" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">21: Create an in-app notification for the reporting Student</tspan></text><path d="M1782,3266L2588,3266" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3331" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3350" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">22: Notification created</tspan></text><path d="M2588,3371L1782,3371" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="3436" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="3455" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">23: Send an automated email containing the resolution notes to the Student</tspan></text><path d="M1782,3476L2998,3476" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3541" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="3560" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">24: Email outcome in UC-50&apos;s successful flow</tspan></text><path d="M2998,3581L1782,3581" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3646" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="3665" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">25: Status updated and feedback sent</tspan><tspan x="1570" dy="20">successfully</tspan></text><path d="M1768,3706L1372,3706" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3771" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="3790" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">26: Status updated and feedback sent</tspan><tspan x="1160" dy="20">successfully</tspan></text><path d="M1358,3831L962,3831" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3896" width="378" height="48" fill="white" stroke="none"/><text x="750" y="3915" text-anchor="middle" font-size="15"><tspan x="750" dy="0">27: Status updated and feedback sent</tspan><tspan x="750" dy="20">successfully</tspan></text><path d="M948,3956L552,3956" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="4021" width="275" height="68" fill="white" stroke="none"/><text x="669" y="4040" text-anchor="start" font-size="15"><tspan x="669" dy="0">28: Refresh the detail / list</tspan><tspan x="669" dy="20">view; display the reply below</tspan><tspan x="669" dy="20">the feedback under BR145</tspan></text><path d="M552,4075h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="4166" width="378" height="28" fill="white" stroke="none"/><text x="340" y="4185" text-anchor="middle" font-size="15"><tspan x="340" dy="0">29: Display update confirmation</tspan></text><path d="M538,4206L142,4206" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>