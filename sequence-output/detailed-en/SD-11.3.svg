<svg xmlns="http://www.w3.org/2000/svg" width="2435" height="3772" viewBox="0 0 2435 3772"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,3717" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1065" width="2385" height="2602" fill="none" stroke="black"/><rect x="39" y="3121" width="2357" height="376" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Game history</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Game history retrieval</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">game_session</tspan></text><path d="M25,1560L2410,1560" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M39,3301L2396,3301" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="3216" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="2560" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="2330" fill="white" stroke="black"/><rect x="1769" y="762" width="12" height="2100" fill="white" stroke="black"/><rect x="30" y="10" width="2375" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-11.3 View game history</tspan></text><rect x="30" y="58" width="2375" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-25 NF1–9, A1–A2; BR71, BR105</tspan></text><rect x="30" y="98" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: valid session, required role, active Student account; JWT authentication under Section 5.2.1. Read-only: viewing history neither changes results nor awards additional coins.</tspan></text><rect x="2179" y="895" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1065" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1085" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1067" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="1086" text-anchor="start" font-size="15"><tspan x="135" dy="0">[no completed game attempts exist — A1]</tspan></text><rect x="125" y="1565" width="2265" height="28" fill="white" stroke="none"/><text x="133" y="1584" text-anchor="start" font-size="15"><tspan x="133" dy="0">[completed game attempts exist]</tspan></text><rect x="2179" y="2616" width="12" height="125" fill="white" stroke="black"/><rect x="39" y="3121" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3141" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="3123" width="2237" height="28" fill="white" stroke="none"/><text x="149" y="3142" text-anchor="start" font-size="15"><tspan x="149" dy="0">[incorrect answers exist]</tspan></text><rect x="139" y="3306" width="2237" height="28" fill="white" stroke="none"/><text x="147" y="3325" text-anchor="start" font-size="15"><tspan x="147" dy="0">[all answers are correct — A2]</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Open Games → Game History</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="48" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve the current Student&apos;s</tspan><tspan x="750" dy="20">completed game attempts</tspan></text><path d="M552,520L948,520" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="585" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="604" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,645L1358,645" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="710" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="729" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve the current Student&apos;s</tspan><tspan x="1570" dy="20">completed game attempts</tspan></text><path d="M1372,770L1768,770" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="835" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="854" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">5: Query only completed attempts belonging</tspan><tspan x="1980" dy="20">to the Student — BR105</tspan></text><path d="M1782,895L2178,895" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="960" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="979" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Game attempt list</tspan></text><path d="M2178,1000L1782,1000" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1120" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1139" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">7: No game history</tspan></text><path d="M1768,1160L1372,1160" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1225" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1244" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">8: No game history</tspan></text><path d="M1358,1265L962,1265" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1330" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1349" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: No game history</tspan></text><path d="M948,1370L552,1370" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1435" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1454" text-anchor="middle" font-size="15"><tspan x="340" dy="0">10: Display a message that no game history</tspan><tspan x="340" dy="20">is available</tspan></text><path d="M538,1495L142,1495" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1616" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1635" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">11: Completed game attempts</tspan></text><path d="M1768,1656L1372,1656" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1721" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1740" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">12: Completed game attempts</tspan></text><path d="M1358,1761L962,1761" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1826" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1845" text-anchor="middle" font-size="15"><tspan x="750" dy="0">13: Completed game attempts</tspan></text><path d="M948,1866L552,1866" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1931" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1950" text-anchor="middle" font-size="15"><tspan x="340" dy="0">14: Display game, scope, score, correct</tspan><tspan x="340" dy="20">answer count and coins earned</tspan></text><path d="M538,1991L142,1991" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2056" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2075" text-anchor="middle" font-size="15"><tspan x="340" dy="0">15: Select a game attempt</tspan></text><path d="M142,2096L538,2096" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="2161" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2180" text-anchor="middle" font-size="15"><tspan x="750" dy="0">16: Retrieve the selected attempt from</tspan><tspan x="750" dy="20">personal game history</tspan></text><path d="M552,2221L948,2221" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2286" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2305" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">17: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,2346L1358,2346" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2411" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2430" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">18: Retrieve the selected attempt from</tspan><tspan x="1570" dy="20">personal game history</tspan></text><path d="M1372,2471L1768,2471" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2536" width="378" height="68" fill="white" stroke="none"/><text x="1980" y="2555" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">19: Retrieve the selected completed</tspan><tspan x="1980" dy="20">attempt belonging to the current Student —</tspan><tspan x="1980" dy="20">BR105</tspan></text><path d="M1782,2616L2178,2616" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2681" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2700" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">20: Game, scope, score, correct count,</tspan><tspan x="1980" dy="20">coins and incorrect answers</tspan></text><path d="M2178,2741L1782,2741" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2806" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2825" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">21: Game attempt details</tspan></text><path d="M1768,2846L1372,2846" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2911" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="2930" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">22: Game attempt details</tspan></text><path d="M1358,2951L962,2951" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3016" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3035" text-anchor="middle" font-size="15"><tspan x="750" dy="0">23: Game attempt details</tspan></text><path d="M948,3056L552,3056" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3176" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3195" text-anchor="middle" font-size="15"><tspan x="340" dy="0">24: Display the attempt&apos;s incorrectly</tspan><tspan x="340" dy="20">answered questions</tspan></text><path d="M538,3236L142,3236" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3357" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3376" text-anchor="middle" font-size="15"><tspan x="340" dy="0">25: Indicate that there are no incorrectly</tspan><tspan x="340" dy="20">answered questions</tspan></text><path d="M538,3417L142,3417" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3527" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3546" text-anchor="middle" font-size="15"><tspan x="340" dy="0">26: Display game, scope, score, correct</tspan><tspan x="340" dy="20">answer count and coins earned</tspan></text><path d="M538,3587L142,3587" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>