<svg xmlns="http://www.w3.org/2000/svg" width="2435" height="3851" viewBox="0 0 2435 3851"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,3796" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1690" width="2385" height="320" fill="none" stroke="black"/><rect x="25" y="2040" width="2385" height="1501" fill="none" stroke="black"/><rect x="39" y="3160" width="2357" height="336" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Administrator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Technical Feedback and Bug Reports</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Technical ticket retrieval</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><path d="M39,3320L2396,3320" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="3696" width="2335" height="50" fill="white" stroke="black"/><rect x="539" y="407" width="12" height="3240" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="2599" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="2369" fill="white" stroke="black"/><rect x="1769" y="742" width="12" height="2159" fill="white" stroke="black"/><rect x="30" y="10" width="2375" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.4 View technical feedback list</tspan></text><rect x="30" y="58" width="2375" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-63 NF1–4, A2a; §5.2.3</tspan></text><rect x="30" y="98" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Precondition: authenticated Administrator. UC-63 and UC-64 use different Vietnamese labels for the resolved status. UC-63 refers to UC-75; the corresponding resolution function is UC-64.</tspan></text><rect x="1781" y="884" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1040" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1690" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1710" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="1692" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="1711" text-anchor="start" font-size="15"><tspan x="135" dy="0">[no pending technical submissions exist — A2a]</tspan></text><rect x="551" y="1774" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2040" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2060" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="2042" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="2061" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Administrator searches / changes filters]</tspan></text><rect x="2179" y="2675" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3160" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3180" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="3162" width="2237" height="28" fill="white" stroke="none"/><text x="149" y="3181" text-anchor="start" font-size="15"><tspan x="149" dy="0">[matching records exist]</tspan></text><rect x="139" y="3325" width="2237" height="28" fill="white" stroke="none"/><text x="147" y="3344" text-anchor="start" font-size="15"><tspan x="147" dy="0">[no matching records exist — Section 5.2.3]</tspan></text><rect x="50" y="3696" width="75" height="28" fill="white" stroke="black"/><text x="58" y="3715" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="3700" width="2225" height="28" fill="white" stroke="none"/><text x="148" y="3719" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-17.5 — Resolve technical feedback</tspan></text><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Open Technical Feedback and System Bug</tspan><tspan x="340" dy="20">Reports</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="480" width="378" height="28" fill="white" stroke="none"/><text x="750" y="499" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve the technical feedback list</tspan></text><path d="M552,520L948,520" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="585" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="604" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,645L1358,645" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="710" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="729" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve the technical feedback list</tspan></text><path d="M1372,750L1768,750" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="815" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="834" text-anchor="start" font-size="15"><tspan x="1899" dy="0">5: Include technical / UI /</tspan><tspan x="1899" dy="20">platform issues only; route</tspan><tspan x="1899" dy="20">academic feedback to</tspan><tspan x="1899" dy="20">Moderators</tspan></text><path d="M1782,889h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="980" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="999" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Retrieve technical tickets for</tspan><tspan x="1980" dy="20">Administrator review</tspan></text><path d="M1782,1040L2178,1040" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1105" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1124" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: Technical ticket list</tspan></text><path d="M2178,1145L1782,1145" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1210" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1229" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">8: Ticket ID, submitter name / email,</tspan><tspan x="1570" dy="20">category, title, created date, status</tspan></text><path d="M1768,1270L1372,1270" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1335" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1354" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">9: Ticket ID, submitter name / email,</tspan><tspan x="1160" dy="20">category, title, created date, status</tspan></text><path d="M1358,1395L962,1395" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1460" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">10: Ticket ID, submitter name / email,</tspan><tspan x="750" dy="20">category, title, created date, status</tspan></text><path d="M948,1520L552,1520" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1585" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1604" text-anchor="middle" font-size="15"><tspan x="340" dy="0">11: Display the technical feedback list</tspan></text><path d="M538,1625L142,1625" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1745" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1764" text-anchor="start" font-size="15"><tspan x="669" dy="0">12: Display the MSG18 inline</tspan><tspan x="669" dy="20">placeholder</tspan></text><path d="M552,1779h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1870" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1889" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: No unprocessed technical feedback is</tspan><tspan x="340" dy="20">currently available</tspan></text><path d="M538,1930L142,1930" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2095" width="378" height="68" fill="white" stroke="none"/><text x="340" y="2114" text-anchor="middle" font-size="15"><tspan x="340" dy="0">14: Filter by status, search keywords or</tspan><tspan x="340" dy="20">select a page under the common</tspan><tspan x="340" dy="20">requirements</tspan></text><path d="M142,2175L538,2175" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="2240" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2259" text-anchor="middle" font-size="15"><tspan x="750" dy="0">15: Retrieve technical feedback matching</tspan><tspan x="750" dy="20">the conditions</tspan></text><path d="M552,2300L948,2300" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2365" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2384" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">16: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,2425L1358,2425" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2490" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2509" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">17: Retrieve technical feedback matching</tspan><tspan x="1570" dy="20">the conditions</tspan></text><path d="M1372,2550L1768,2550" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2615" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2634" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">18: Search / filter / paginate technical</tspan><tspan x="1980" dy="20">tickets only</tspan></text><path d="M1782,2675L2178,2675" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2740" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2759" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">19: Matching ticket list</tspan></text><path d="M2178,2780L1782,2780" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2845" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2864" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">20: Search results</tspan></text><path d="M1768,2885L1372,2885" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2950" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="2969" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">21: Search results</tspan></text><path d="M1358,2990L962,2990" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3055" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3074" text-anchor="middle" font-size="15"><tspan x="750" dy="0">22: Search results</tspan></text><path d="M948,3095L552,3095" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3215" width="378" height="28" fill="white" stroke="none"/><text x="340" y="3234" text-anchor="middle" font-size="15"><tspan x="340" dy="0">23: Display the filtered list</tspan></text><path d="M538,3255L142,3255" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3376" width="378" height="28" fill="white" stroke="none"/><text x="340" y="3395" text-anchor="middle" font-size="15"><tspan x="340" dy="0">24: Display a clear empty state</tspan></text><path d="M538,3416L142,3416" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3571" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3590" text-anchor="middle" font-size="15"><tspan x="340" dy="0">25: Select a ticket to view details and</tspan><tspan x="340" dy="20">proceed to resolution</tspan></text><path d="M142,3631L538,3631" fill="none" stroke="black"  marker-end="url(#block)"/></g></svg>