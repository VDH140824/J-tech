<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2032" viewBox="0 0 1615 2032"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="795" width="1565" height="1132" fill="none" stroke="black"/><rect x="39" y="1060" width="1537" height="822" fill="none" stroke="black"/><rect x="53" y="1296" width="1509" height="541" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Scheduler</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«control»</tspan><tspan x="545" dy="20">Daily_Streak_Reset_Job</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«entity»</tspan><tspan x="955" dy="20">User_Streak</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«entity»</tspan><tspan x="1365" dy="20">Recorded learning days</tspan></text><path d="M39,1240L1576,1240" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,1561L1562,1561" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="1742" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="1772" text-anchor="start" font-size="15"><tspan x="58" dy="0">BR74 refers to BR146, which is absent from the supplied SRS. Freeze activation, expiry and consumption are therefore not specified here.</tspan></text><rect x="539" y="387" width="12" height="1306" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.4 Daily streak reset job</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: NS-02 Daily_Streak_Reset_Job; BR43, BR74, BR112; §5.2.5</tspan></text><rect x="30" y="98" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages</tspan><tspan x="38" dy="19">are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="149" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="167" text-anchor="start" font-size="14"><tspan x="38" dy="0">Unresolved source conflict: NS-02 accepts qualifying login or completed study and states CurrentDate − LastLearningDate &gt; 1; BR112 excludes login. Eligibility here follows BR74 / BR112;</tspan><tspan x="38" dy="19">execution time follows NS-02.</tspan></text><rect x="551" y="489" width="12" height="45" fill="white" stroke="black"/><rect x="949" y="625" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="795" width="90" height="30" fill="white" stroke="black"/><text x="33" y="815" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="797" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="816" text-anchor="start" font-size="15"><tspan x="135" dy="0">[for each Student in User_Streak]</tspan></text><rect x="1359" y="890" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="1060" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1080" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1062" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="1081" text-anchor="start" font-size="15"><tspan x="149" dy="0">[the preceding day has a qualifying completion — BR112]</tspan></text><rect x="551" y="1144" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1245" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1264" text-anchor="start" font-size="15"><tspan x="147" dy="0">[the preceding day has no qualifying completion — BR74]</tspan></text><rect x="53" y="1296" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1316" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1298" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1317" text-anchor="start" font-size="15"><tspan x="163" dy="0">[the streak is not preserved by a streak-freeze item]</tspan></text><rect x="949" y="1391" width="12" height="105" fill="white" stroke="black"/><rect x="153" y="1566" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="1585" text-anchor="start" font-size="15"><tspan x="161" dy="0">[the streak is preserved under the streak-freeze exception in BR74]</tspan></text><rect x="551" y="1646" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Trigger daily at 00:00:01 GMT+7 — NS-02</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="460" width="275" height="48" fill="white" stroke="none"/><text x="669" y="479" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: Use calendar dates in</tspan><tspan x="669" dy="20">Asia/Ho_Chi_Minh — BR74</tspan></text><path d="M552,494h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="585" width="378" height="28" fill="white" stroke="none"/><text x="750" y="604" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: Scan User_Streak records</tspan></text><path d="M552,625L948,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="690" width="378" height="28" fill="white" stroke="none"/><text x="750" y="709" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: Streak records</tspan></text><path d="M948,730L552,730" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="850" width="788" height="28" fill="white" stroke="none"/><text x="955" y="869" text-anchor="middle" font-size="15"><tspan x="955" dy="0">5: Check for qualifying learning completion on the preceding calendar day</tspan></text><path d="M552,890L1358,890" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="955" width="788" height="28" fill="white" stroke="none"/><text x="955" y="974" text-anchor="middle" font-size="15"><tspan x="955" dy="0">6: Preceding-day activity information</tspan></text><path d="M1358,995L552,995" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1115" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1134" text-anchor="start" font-size="15"><tspan x="669" dy="0">7: Preserve the streak; do not</tspan><tspan x="669" dy="20">reset</tspan></text><path d="M552,1149h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1351" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1370" text-anchor="middle" font-size="15"><tspan x="750" dy="0">8: Set current_streak = 0</tspan></text><path d="M552,1391L948,1391" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1456" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1475" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: Streak reset</tspan></text><path d="M948,1496L552,1496" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1617" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1636" text-anchor="start" font-size="15"><tspan x="669" dy="0">10: Do not reset under the</tspan><tspan x="669" dy="20">exception stated in BR74</tspan></text><path d="M552,1651h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/></g></svg>