<svg xmlns="http://www.w3.org/2000/svg" width="3665" height="4067" viewBox="0 0 3665 4067"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3415,315L3415,4012" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="940" width="3615" height="831" fill="none" stroke="black"/><rect x="39" y="1225" width="3587" height="501" fill="none" stroke="black"/><rect x="25" y="1801" width="3615" height="425" fill="none" stroke="black"/><rect x="25" y="2466" width="3615" height="1016" fill="none" stroke="black"/><rect x="39" y="3086" width="3587" height="150" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Learning activity completion</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Learning / practice activity</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="237.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Learning activity and streak</tspan><tspan x="1775" dy="20">recording</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="247.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">learning_item_progress /</tspan><tspan x="2185" dy="20">lesson_section_progress</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">practice_attempt</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">study_session / User_Streak</tspan></text><rect x="3255" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3415" y="247.5" text-anchor="middle" font-size="15"><tspan x="3415" dy="0">«entity»</tspan><tspan x="3415" dy="20">Reward milestone configuration /</tspan><tspan x="3415" dy="20">coin ledger</tspan></text><path d="M39,1510L3626,1510" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="3141" width="3565" height="50" fill="white" stroke="black"/><path d="M25,3266L3640,3266" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3536" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="3326" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="3076" fill="white" stroke="black"/><rect x="1769" y="742" width="12" height="2846" fill="white" stroke="black"/><rect x="30" y="10" width="3605" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.3 Record activity &amp; update learning streak</tspan></text><rect x="30" y="58" width="3605" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-26 NF1–5; BR43, BR45, BR106–107, BR112; §3.1.5; §5.2.5</tspan></text><rect x="30" y="98" width="3605" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="3605" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR112 excludes login and merely opening a lesson. NS-02 mentions qualifying login, which conflicts with BR112; this diagram shows BR112&apos;s learning-day rule. No unspecified streak initialization or freeze mechanism is added.</tspan></text><rect x="1781" y="844" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="940" width="90" height="30" fill="white" stroke="black"/><text x="33" y="960" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="942" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="961" text-anchor="start" font-size="15"><tspan x="135" dy="0">[learning content is completed — UC-26 NF1–2]</tspan></text><rect x="2179" y="1055" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="1225" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1245" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1227" width="3467" height="28" fill="white" stroke="none"/><text x="149" y="1246" text-anchor="start" font-size="15"><tspan x="149" dy="0">[content / knowledge is completed for the first time]</tspan></text><rect x="2179" y="1340" width="12" height="105" fill="white" stroke="black"/><rect x="139" y="1515" width="3467" height="28" fill="white" stroke="none"/><text x="147" y="1534" text-anchor="start" font-size="15"><tspan x="147" dy="0">[content was completed previously — BR106]</tspan></text><rect x="1781" y="1615" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1801" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1821" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="1803" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="1822" text-anchor="start" font-size="15"><tspan x="135" dy="0">[a practice attempt is completed — NF3–4 / BR107]</tspan></text><rect x="2589" y="1896" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="2115" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="2296" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="2466" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2486" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2468" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="2487" text-anchor="start" font-size="15"><tspan x="135" dy="0">[the current day has not yet counted toward the learning streak]</tspan></text><rect x="1781" y="2570" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="2706" width="12" height="105" fill="white" stroke="black"/><rect x="3409" y="2916" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3086" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3106" text-anchor="start" font-size="15"><tspan x="47" dy="0">opt</tspan></text><rect x="141" y="3088" width="3467" height="28" fill="white" stroke="none"/><text x="149" y="3107" text-anchor="start" font-size="15"><tspan x="149" dy="0">[a milestone not yet rewarded in this streak is reached]</tspan></text><rect x="50" y="3141" width="75" height="28" fill="white" stroke="black"/><text x="58" y="3160" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="3145" width="3455" height="28" fill="white" stroke="none"/><text x="148" y="3164" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-13.2 — Award the configured milestone coins once per unbroken learning streak</tspan></text><rect x="125" y="3271" width="3495" height="28" fill="white" stroke="none"/><text x="133" y="3290" text-anchor="start" font-size="15"><tspan x="133" dy="0">[the current day has already been counted — BR112]</tspan></text><rect x="1781" y="3371" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Complete a learning / practice</tspan><tspan x="340" dy="20">activity, including review</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="480" width="378" height="28" fill="white" stroke="none"/><text x="750" y="499" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Record the Student&apos;s completed activity</tspan></text><path d="M552,520L948,520" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="585" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="604" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,645L1358,645" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="710" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="729" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Record the Student&apos;s completed activity</tspan></text><path d="M1372,750L1768,750" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="815" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="834" text-anchor="start" font-size="15"><tspan x="1899" dy="0">5: Determine the calendar day</tspan><tspan x="1899" dy="20">in Asia/Ho_Chi_Minh — BR112</tspan></text><path d="M1782,849h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="995" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="1014" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Check whether completion of this</tspan><tspan x="1980" dy="20">content has already been recorded</tspan></text><path d="M1782,1055L2178,1055" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1120" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1139" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: Existing completion information</tspan></text><path d="M2178,1160L1782,1160" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1280" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="1299" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">8: Record the content and first completion</tspan><tspan x="1980" dy="20">time</tspan></text><path d="M1782,1340L2178,1340" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1405" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1424" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">9: First completion record</tspan></text><path d="M2178,1445L1782,1445" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="1566" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="1585" text-anchor="start" font-size="15"><tspan x="1899" dy="0">10: Do not count it again as</tspan><tspan x="1899" dy="20">new knowledge or newly</tspan><tspan x="1899" dy="20">completed content</tspan></text><path d="M1782,1620h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1856" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1875" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">11: Store each attempt: activity, completion time, score or correct answer count / total</tspan></text><path d="M1782,1896L2588,1896" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1961" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1980" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">12: New attempt retained</tspan></text><path d="M2588,2001L1782,2001" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2066" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2085" text-anchor="start" font-size="15"><tspan x="1899" dy="0">13: Retain attempts to</tspan><tspan x="1899" dy="20">identify first, most recent</tspan><tspan x="1899" dy="20">and highest results</tspan></text><path d="M1782,2120h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2256" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2275" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">14: Record the actual learning day; retrieve recorded learning days and current streak</tspan></text><path d="M1782,2296L2998,2296" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2361" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2380" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">15: Actual learning days and current streak</tspan></text><path d="M2998,2401L1782,2401" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2521" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2540" text-anchor="start" font-size="15"><tspan x="1899" dy="0">16: Determine consecutive</tspan><tspan x="1899" dy="20">learning days from qualifying</tspan><tspan x="1899" dy="20">recorded completions</tspan></text><path d="M1782,2575h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2666" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2685" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">17: Update the learning streak at most once per calendar day</tspan></text><path d="M1782,2706L2998,2706" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2771" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2790" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">18: Updated learning streak</tspan></text><path d="M2998,2811L1782,2811" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="2876" width="1608" height="28" fill="white" stroke="none"/><text x="2595" y="2895" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">19: Read milestones and identify a milestone not yet rewarded within this unbroken streak</tspan></text><path d="M1782,2916L3408,2916" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2981" width="1608" height="28" fill="white" stroke="none"/><text x="2595" y="3000" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">20: Milestone reward conditions under BR45</tspan></text><path d="M3408,3021L1782,3021" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="3322" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="3341" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21: Do not increase the streak</tspan><tspan x="1899" dy="20">again; completed review still</tspan><tspan x="1899" dy="20">qualifies as learning activity</tspan></text><path d="M1782,3376h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="3512" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="3531" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">22: Activity recording and learning streak</tspan><tspan x="1570" dy="20">result</tspan></text><path d="M1768,3572L1372,3572" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3637" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="3656" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">23: Activity recording and learning streak</tspan><tspan x="1160" dy="20">result</tspan></text><path d="M1358,3697L962,3697" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3762" width="378" height="48" fill="white" stroke="none"/><text x="750" y="3781" text-anchor="middle" font-size="15"><tspan x="750" dy="0">24: Activity recording and learning streak</tspan><tspan x="750" dy="20">result</tspan></text><path d="M948,3822L552,3822" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3887" width="378" height="28" fill="white" stroke="none"/><text x="340" y="3906" text-anchor="middle" font-size="15"><tspan x="340" dy="0">25: Completed activity recorded</tspan></text><path d="M538,3927L142,3927" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>