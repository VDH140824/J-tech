70" y="4575" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">34: MSG17 — Feedback processing status</tspan><tspan x="1570" dy="20">updated successfully</tspan></text><path d="M1768,4616L1372,4616" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="4681" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="4700" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">35: MSG17 — Feedback processing status</tspan><tspan x="1160" dy="20">updated successfully</tspan></text><path d="M1358,4741L962,4741" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="4806" width="378" height="48" fill="white" stroke="none"/><text x="750" y="4825" text-anchor="middle" font-size="15"><tspan x="750" dy="0">36: MSG17 — Feedback processing status</tspan><tspan x="750" dy="20">updated successfully</tspan></text><path d="M948,4866L552,4866" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="4931" width="275" height="68" fill="white" stroke="none"/><text x="669" y="4950" text-anchor="start" font-size="15"><tspan x="669" dy="0">37: Display the updated status</tspan><tspan x="669" dy="20">and the reply below the</tspan><tspan x="669" dy="20">feedback — BR144–145</tspan></text><path d="M552,4985h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="5076" width="378" height="28" fill="white" stroke="none"/><text x="340" y="5095" text-anchor="middle" font-size="15"><tspan x="340" dy="0">38: Display update confirmation</tspan></text><path d="M538,5116L142,5116" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>