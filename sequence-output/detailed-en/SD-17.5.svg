<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="5256" viewBox="0 0 3255 5256"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,5201" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1840" width="3205" height="195" fill="none" stroke="black"/><rect x="25" y="2690" width="3205" height="570" fill="none" stroke="black"/><rect x="25" y="3835" width="3205" height="691" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Administrator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="237.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Technical feedback details /</tspan><tspan x="545" dy="20">resolution</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Resolution update and notification</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">notification / audit_log</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">Email Service</tspan></text><path d="M25,3995L3230,3995" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="4745" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="4390" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="4140" fill="white" stroke="black"/><rect x="1769" y="722" width="12" height="3910" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.5 Resolve technical feedback</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-64 NF1–7, A5a, A6a; BR59, BR144–145</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">UC-64 NF5 requires nonblank notes; A5a / BR59 explicitly require them for Resolved / Rejected. The SRS is unclear about blank notes for In Progress. UC-64 refers to UC-74; the corresponding list is UC-63.</tspan></text><rect x="2179" y="855" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="1744" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1840" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1860" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="1842" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="1861" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Resolved / Rejected has blank notes — A5a / BR59]</tspan></text><rect x="1371" y="2344" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2594" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2690" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2710" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="2692" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="2711" text-anchor="start" font-size="15"><tspan x="135" dy="0">[the required-note check fails]</tspan></text><rect x="2179" y="3350" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="3560" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="3835" width="90" height="30" fill="white" stroke="black"/><text x="33" y="3855" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="3837" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="3856" text-anchor="start" font-size="15"><tspan x="135" dy="0">[email delivery succeeds]</tspan></text><rect x="2999" y="3770" width="12" height="160" fill="white" stroke="black"/><rect x="125" y="4000" width="3085" height="28" fill="white" stroke="none"/><text x="133" y="4019" text-anchor="start" font-size="15"><tspan x="133" dy="0">[email delivery failure — A6a]</tspan></text><rect x="2589" y="4196" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="4415" width="12" height="45" fill="white" stroke="black"/><rect x="551" y="4980" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Open the selected technical ticket</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve technical ticket details</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="690" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="709" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve technical ticket details</tspan></text><path d="M1372,730L1768,730" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="795" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="814" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">5: Retrieve the description, attached</tspan><tspan x="1980" dy="20">error screenshots and device information</tspan></text><path d="M1782,855L2178,855" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="920" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="939" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Technical feedback details</tspan></text><path d="M2178,960L1782,960" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1025" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1044" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">7: Report information for resolution</tspan></text><path d="M1768,1065L1372,1065" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1130" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1149" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">8: Report information for resolution</tspan></text><path d="M1358,1170L962,1170" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1235" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1254" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: Report information for resolution</tspan></text><path d="M948,1275L552,1275" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1340" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1359" text-anchor="middle" font-size="15"><tspan x="340" dy="0">10: Display ticket details</tspan></text><path d="M538,1380L142,1380" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1445" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1464" text-anchor="middle" font-size="15"><tspan x="340" dy="0">11: Select In Progress / Resolved /</tspan><tspan x="340" dy="20">Rejected</tspan></text><path d="M142,1505L538,1505" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1570" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1589" text-anchor="middle" font-size="15"><tspan x="340" dy="0">12: Enter resolution notes and click</tspan><tspan x="340" dy="20">Update Status</tspan></text><path d="M142,1630L538,1630" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="1695" width="275" height="68" fill="white" stroke="none"/><text x="669" y="1714" text-anchor="start" font-size="15"><tspan x="669" dy="0">13: Trim and validate</tspan><tspan x="669" dy="20">client-side notes — Section</tspan><tspan x="669" dy="20">5.2.2</tspan></text><path d="M552,1749h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1895" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1914" text-anchor="middle" font-size="15"><tspan x="340" dy="0">14: Display MSG09 in red and prevent</tspan><tspan x="340" dy="20">saving</tspan></text><path d="M538,1955L142,1955" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2065" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2084" text-anchor="middle" font-size="15"><tspan x="750" dy="0">15: Submit the status and resolution notes</tspan></text><path d="M552,2105L948,2105" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2170" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2189" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">16: Forward the request with the</tspan><tspan x="1160" dy="20">Administrator session</tspan></text><path d="M962,2230L1358,2230" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="2295" width="275" height="68" fill="white" stroke="none"/><text x="1489" y="2314" text-anchor="start" font-size="15"><tspan x="1489" dy="0">17: Validate / sanitize</tspan><tspan x="1489" dy="20">server-side user input —</tspan><tspan x="1489" dy="20">Section 5.2.2</tspan></text><path d="M1372,2349h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2440" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2459" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">18: Process the technical ticket</tspan><tspan x="1570" dy="20">resolution update</tspan></text><path d="M1372,2500L1768,2500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2565" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="2584" text-anchor="start" font-size="15"><tspan x="1899" dy="0">19: Validate the notes under</tspan><tspan x="1899" dy="20">UC-64 NF5</tspan></text><path d="M1782,2599h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2745" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2764" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">20: Require resolution notes without</tspan><tspan x="1570" dy="20">saving</tspan></text><path d="M1768,2805L1372,2805" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2870" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2889" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">21: Require resolution notes without</tspan><tspan x="1160" dy="20">saving</tspan></text><path d="M1358,2930L962,2930" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2995" width="378" height="48" fill="white" stroke="none"/><text x="750" y="3014" text-anchor="middle" font-size="15"><tspan x="750" dy="0">22: Require resolution notes without</tspan><tspan x="750" dy="20">saving</tspan></text><path d="M948,3055L552,3055" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3120" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3139" text-anchor="middle" font-size="15"><tspan x="340" dy="0">23: Require resolution notes without</tspan><tspan x="340" dy="20">saving</tspan></text><path d="M538,3180L142,3180" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="3290" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="3309" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">24: Persist the resolution status and</tspan><tspan x="1980" dy="20">notes</tspan></text><path d="M1782,3350L2178,3350" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3415" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="3434" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">25: Resolution data stored</tspan></text><path d="M2178,3455L1782,3455" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="3520" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3539" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">26: Create an in-app notification for the reporting Student</tspan></text><path d="M1782,3560L2588,3560" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3625" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3644" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">27: Notification created</tspan></text><path d="M2588,3665L1782,3665" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/>