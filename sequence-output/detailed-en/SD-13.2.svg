<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2757" viewBox="0 0 1615 2757"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,2702" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,2702" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,2702" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,2702" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="705" width="1565" height="1947" fill="none" stroke="black"/><rect x="39" y="990" width="1537" height="1617" fill="none" stroke="black"/><rect x="53" y="1726" width="1509" height="836" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Reward-eligible activity</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«control»</tspan><tspan x="545" dy="20">Coin_EXP_Transaction_Ledger</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«entity»</tspan><tspan x="955" dy="20">coin_transaction</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«entity»</tspan><tspan x="1365" dy="20">user / coin balance</tspan></text><rect x="50" y="480" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="510" text-anchor="start" font-size="15"><tspan x="58" dy="0">The calling flow applies configured reward conditions and amounts. BR40: first successful completion; BR45: each milestone once per unbroken learning streak.</tspan></text><path d="M39,1315L1576,1315" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,2116L1562,2116" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="2091" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-13.2 Award coins with idempotent ledger</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: NS-08 Coin_EXP_Transaction_Ledger; BR40, BR45, BR68–69; §4 Data Integrity</tspan></text><rect x="30" y="98" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages</tspan><tspan x="38" dy="19">are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="149" width="1555" height="27" fill="white" stroke="none"/><text x="38" y="167" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR45 specifies streak milestone rewards; NS-08 describes exercise / game completion. No unspecified key algorithm, EXP amount, SQL, endpoint or coin amount is introduced.</tspan></text><rect x="551" y="609" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="705" width="90" height="30" fill="white" stroke="black"/><text x="33" y="725" text-anchor="start" font-size="15"><tspan x="33" dy="0">critical</tspan></text><rect x="127" y="707" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="726" text-anchor="start" font-size="15"><tspan x="135" dy="0">[ACID transaction with idempotency protection — NS-08 / Section 4]</tspan></text><rect x="949" y="820" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="990" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1010" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="992" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="1011" text-anchor="start" font-size="15"><tspan x="149" dy="0">[the award key already exists]</tspan></text><rect x="551" y="1094" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1320" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1339" text-anchor="start" font-size="15"><tspan x="147" dy="0">[the award key does not exist]</tspan></text><rect x="1359" y="1411" width="12" height="105" fill="white" stroke="black"/><rect x="53" y="1726" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1746" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1728" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1747" text-anchor="start" font-size="15"><tspan x="163" dy="0">[all updates succeed]</tspan></text><rect x="949" y="1661" width="12" height="160" fill="white" stroke="black"/><rect x="551" y="1915" width="12" height="45" fill="white" stroke="black"/><rect x="153" y="2121" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="2140" text-anchor="start" font-size="15"><tspan x="161" dy="0">[the transaction cannot be completed]</tspan></text><rect x="551" y="2326" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Request a reward after exercise / game</tspan><tspan x="340" dy="20">completion — NS-08</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="560" width="275" height="68" fill="white" stroke="none"/><text x="669" y="579" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: Use an idempotency award</tspan><tspan x="669" dy="20">key; its format is not</tspan><tspan x="669" dy="20">specified by the SRS</tspan></text><path d="M552,614h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="760" width="378" height="48" fill="white" stroke="none"/><text x="750" y="779" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: Check whether the award key has already</tspan><tspan x="750" dy="20">been recorded in the ledger</tspan></text><path d="M552,820L948,820" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="885" width="378" height="28" fill="white" stroke="none"/><text x="750" y="904" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: Award key exists / does not exist</tspan></text><path d="M948,925L552,925" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1045" width="275" height="68" fill="white" stroke="none"/><text x="669" y="1064" text-anchor="start" font-size="15"><tspan x="669" dy="0">5: Do not allocate additional</tspan><tspan x="669" dy="20">coins / EXP or create another</tspan><tspan x="669" dy="20">ledger entry</tspan></text><path d="M552,1099h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1190" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1209" text-anchor="middle" font-size="15"><tspan x="340" dy="0">6: Do not grant a duplicate reward for the</tspan><tspan x="340" dy="20">same key</tspan></text><path d="M538,1250L142,1250" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1371" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1390" text-anchor="middle" font-size="15"><tspan x="955" dy="0">7: Credit profile EXP and coin balance within the transaction</tspan></text><path d="M552,1411L1358,1411" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1476" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1495" text-anchor="middle" font-size="15"><tspan x="955" dy="0">8: Profile / balance update result</tspan></text><path d="M1358,1516L552,1516" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1581" width="378" height="68" fill="white" stroke="none"/><text x="750" y="1600" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: Record an immutable entry: EARN,</tspan><tspan x="750" dy="20">amount, post-transaction balance, source</tspan><tspan x="750" dy="20">activity and idempotency key</tspan></text><path d="M552,1661L948,1661" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1781" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1800" text-anchor="middle" font-size="15"><tspan x="750" dy="0">10: Ledger entry recorded</tspan></text><path d="M948,1821L552,1821" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1886" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1905" text-anchor="start" font-size="15"><tspan x="669" dy="0">11: Commit the ACID</tspan><tspan x="669" dy="20">transaction</tspan></text><path d="M552,1920h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="2011" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2030" text-anchor="middle" font-size="15"><tspan x="340" dy="0">12: Committed reward allocation result</tspan></text><path d="M538,2051L142,2051" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2172" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2191" text-anchor="middle" font-size="15"><tspan x="750" dy="0">13: Transaction failed</tspan></text><path d="M948,2212L552,2212" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="2277" width="275" height="68" fill="white" stroke="none"/><text x="669" y="2296" text-anchor="start" font-size="15"><tspan x="669" dy="0">14: Roll back the changes; do</tspan><tspan x="669" dy="20">not allocate coins / EXP</tspan><tspan x="669" dy="20">partially</tspan></text><path d="M552,2331h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="2422" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2441" text-anchor="middle" font-size="15"><tspan x="340" dy="0">15: Reward allocation failed; preserve</tspan><tspan x="340" dy="20">pre-transaction data</tspan></text><path d="M538,2482L142,2482" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>