<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="4562" viewBox="0 0 2845 4562"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4507" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1960" width="2795" height="376" fill="none" stroke="black"/><rect x="25" y="3181" width="2795" height="1276" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Content feedback details</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="237.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Content feedback retrieval and</tspan><tspan x="1775" dy="20">verification</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="247.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">course / chapter / lesson /</tspan><tspan x="2595" dy="20">question</tspan></text><path d="M25,2140L2820,2140" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M25,3946L2820,3946" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3986" fill="white" stroke="black"/><rect x="949" y="532" width="12" height="3736" fill="white" stroke="black"/><rect x="1359" y="657" width="12" height="3506" fill="white" stroke="black"/><rect x="1769" y="782" width="12" height="3276" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.2 View content feedback detail</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-49 NF1–5, A2a, A3a; BR113</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: authenticated Moderator; a content feedback ticket is selected. Read-only: do not change ticket status. UC-49 refers to UC-95 for the list, whose actual title is UC-48.</tspan></text><rect x="2179" y="935" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1145" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="1739" width="12" height="45" fill="white" stroke="black"/><rect x="551" y="1864" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1960" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1980" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1962" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1981" text-anchor="start" font-size="15"><tspan x="135" dy="0">[image attachments exist]</tspan></text><rect x="551" y="2044" width="12" height="45" fill="white" stroke="black"/><rect x="125" y="2145" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="2164" text-anchor="start" font-size="15"><tspan x="133" dy="0">[no images are attached — A2a]</tspan></text><rect x="551" y="2225" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3011" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="3181" width="90" height="30" fill="white" stroke="black"/><text x="33" y="3201" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="3183" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="3202" text-anchor="start" font-size="15"><tspan x="135" dy="0">[the learning material is available]</tspan></text><rect x="551" y="3600" width="12" height="45" fill="white" stroke="black"/><rect x="125" y="3951" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="3970" text-anchor="start" font-size="15"><tspan x="133" dy="0">[the learning material is deleted / hidden / archived — A3a]</tspan></text><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select View Details on a content</tspan><tspan x="340" dy="20">feedback ticket</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="480" width="378" height="48" fill="white" stroke="none"/><text x="750" y="499" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Retrieve the selected content feedback</tspan><tspan x="750" dy="20">details</tspan></text><path d="M552,540L948,540" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="605" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="624" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,665L1358,665" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="730" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="749" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Retrieve the selected content feedback</tspan><tspan x="1570" dy="20">details</tspan></text><path d="M1372,790L1768,790" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="855" width="378" height="68" fill="white" stroke="none"/><text x="1980" y="874" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">5: Retrieve Student information, email,</tspan><tspan x="1980" dy="20">submission time, category, status, title,</tspan><tspan x="1980" dy="20">description and attachments</tspan></text><path d="M1782,935L2178,935" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1000" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1019" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Feedback detail data</tspan></text><path d="M2178,1040L1782,1040" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1105" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1124" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">7: Retrieve the reported Course / Chapter / Lesson / Question context</tspan></text><path d="M1782,1145L2588,1145" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1210" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1229" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: Content context and links</tspan></text><path d="M2588,1250L1782,1250" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1315" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1334" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">9: General information, description,</tspan><tspan x="1570" dy="20">images and learning-material context</tspan></text><path d="M1768,1375L1372,1375" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1440" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1459" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">10: General information, description,</tspan><tspan x="1160" dy="20">images and learning-material context</tspan></text><path d="M1358,1500L962,1500" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1565" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1584" text-anchor="middle" font-size="15"><tspan x="750" dy="0">11: General information, description,</tspan><tspan x="750" dy="20">images and learning-material context</tspan></text><path d="M948,1625L552,1625" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1690" width="275" height="68" fill="white" stroke="none"/><text x="669" y="1709" text-anchor="start" font-size="15"><tspan x="669" dy="0">12: Display ID, Student name /</tspan><tspan x="669" dy="20">email, submission time, error</tspan><tspan x="669" dy="20">category and current status</tspan></text><path d="M552,1744h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="1835" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1854" text-anchor="start" font-size="15"><tspan x="669" dy="0">13: Display the title and</tspan><tspan x="669" dy="20">detailed description</tspan></text><path d="M552,1869h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="2015" width="275" height="48" fill="white" stroke="none"/><text x="669" y="2034" text-anchor="start" font-size="15"><tspan x="669" dy="0">14: Display image / screenshot</tspan><tspan x="669" dy="20">previews</tspan></text><path d="M552,2049h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="2196" width="275" height="48" fill="white" stroke="none"/><text x="669" y="2215" text-anchor="start" font-size="15"><tspan x="669" dy="0">15: Display No image</tspan><tspan x="669" dy="20">attachments</tspan></text><path d="M552,2230h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="2366" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2385" text-anchor="middle" font-size="15"><tspan x="340" dy="0">16: Display complete feedback information</tspan><tspan x="340" dy="20">and learning-material links</tspan></text><path d="M538,2426L142,2426" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2491" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2510" text-anchor="middle" font-size="15"><tspan x="340" dy="0">17: Select View Lecture</tspan></text><path d="M142,2531L538,2531" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="2596" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2615" text-anchor="middle" font-size="15"><tspan x="750" dy="0">18: Open the linked learning material /</tspan><tspan x="750" dy="20">question for verification</tspan></text><path d="M552,2656L948,2656" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2721" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2740" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">19: Forward the request with the current</tspan><tspan x="1160" dy="20">authenticated session</tspan></text><path d="M962,2781L1358,2781" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2846" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2865" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">20: Open the linked learning material /</tspan><tspan x="1570" dy="20">question for verification</tspan></text><path d="M1372,2906L1768,2906" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2971" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="2990" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">21: Check whether the material / question is available or deleted / hidden / archived</tspan></text><path d="M1782,3011L2588,3011" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3076" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3095" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">22: Related learning material availability</tspan></text><path d="M2588,3116L1782,3116" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3236" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3255" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">23: Content link in Curriculum Management</tspan></text><path d="M1768,3276L1372,3276" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3341" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3360" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">24: Content link in Curriculum Management</tspan></text><path d="M1358,3381L962,3381" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3446" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3465" text-anchor="middle" font-size="15"><tspan x="750" dy="0">25: Content link in Curriculum Management</tspan></text><path d="M948,3486L552,3486" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="3551" width="275" height="68" fill="white" stroke="none"/><text x="669" y="3570" text-anchor="start" font-size="15"><tspan x="669" dy="0">26: Open a new tab or navigate</tspan><tspan x="669" dy="20">directly to the target lesson</tspan><tspan x="669" dy="20">/ question</tspan></text><path d="M552,3605h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="3696" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3715" text-anchor="middle" font-size="15"><tspan x="340" dy="0">27: Moderator verifies the academic</tspan><tspan x="340" dy="20">content</tspan></text><path d="M538,3756L142,3756" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3821" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3840" text-anchor="middle" font-size="15"><tspan x="340" dy="0">28: Return to the feedback details after</tspan><tspan x="340" dy="20">verification</tspan></text><path d="M142,3881L538,3881" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="4002" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="4021" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">29: Related content is no longer available</tspan></text><path d="M1768,4042L1372,4042" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="4107" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="4126" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">30: Related content is no longer available</tspan></text><path d="M1358,4147L962,4147" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="4212" width="378" height="28" fill="white" stroke="none"/><text x="750" y="4231" text-anchor="middle" font-size="15"><tspan x="750" dy="0">31: Related content is no longer available</tspan></text><path d="M948,4252L552,4252" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="4317" width="378" height="48" fill="white" stroke="none"/><text x="340" y="4336" text-anchor="middle" font-size="15"><tspan x="340" dy="0">32: Display an alert that the material /</tspan><tspan x="340" dy="20">question is unavailable or archived</tspan></text><path d="M538,4377L142,4377" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>