<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4166" viewBox="0 0 3255 4166"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4111" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="435" width="3205" height="1365" fill="none" stroke="black"/><rect x="39" y="1140" width="3177" height="615" fill="none" stroke="black"/><rect x="25" y="2685" width="3205" height="561" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Game play and results</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">API communication</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Request handling</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Game evaluation and completion</tspan><tspan x="1775" dy="20">Business responsibility</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">game / reward rules</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">game_session</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">Coin_EXP_Transaction_Ledger</tspan></text><rect x="50" y="355" width="3155" height="50" fill="white" stroke="none"/><text x="58" y="385" text-anchor="start" font-size="15"><tspan x="58" dy="0">Precondition: the game was initialized in SD-11.1. The SRS does not specify whether every game action requires a server request; these interactions represent logical responsibilities.</tspan></text><rect x="50" y="2845" width="3155" height="50" fill="white" stroke="black"/><path d="M25,3030L3230,3030" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="542" width="12" height="3500" fill="white" stroke="black"/><rect x="949" y="1882" width="12" height="1890" fill="white" stroke="black"/><rect x="1359" y="1987" width="12" height="1680" fill="white" stroke="black"/><rect x="1769" y="647" width="12" height="2915" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-11.2 Answer &amp; complete game session</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-24 NF15–21, A1–A2; BR40, BR66, BR68–72; NS-08</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">SRS-based logical interaction model. Boundary / API / control lifelines represent responsibilities, not unspecified code classes, methods, endpoints or HTTP status codes. UI labels and messages are translated into English for these diagrams; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Game rules, scoring formula, completion conditions and coin amounts remain those referenced by UC-24 / BR66 / BR68–69; no additional values are specified here.</tspan></text><rect x="25" y="435" width="90" height="30" fill="white" stroke="black"/><text x="33" y="455" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="437" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="456" text-anchor="start" font-size="15"><tspan x="135" dy="0">[the game completion condition has not been reached — UC-24 NF15–17]</tspan></text><rect x="1781" y="729" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="834" width="12" height="45" fill="white" stroke="black"/><rect x="39" y="1140" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1160" text-anchor="start" font-size="15"><tspan x="47" dy="0">break</tspan></text><rect x="141" y="1142" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="1161" text-anchor="start" font-size="15"><tspan x="149" dy="0">[Student exits before game completion — A2 / BR66]</tspan></text><rect x="1781" y="1434" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2214" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="2370" width="12" height="125" fill="white" stroke="black"/><rect x="1781" y="2589" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2685" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2705" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2687" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="2706" text-anchor="start" font-size="15"><tspan x="135" dy="0">[reward conditions are satisfied]</tspan></text><rect x="50" y="2845" width="75" height="28" fill="white" stroke="black"/><text x="58" y="2864" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="2849" width="3045" height="28" fill="white" stroke="none"/><text x="148" y="2868" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-13.2 — Award coins: ACID, idempotency key, BR40</tspan></text><rect x="2999" y="2780" width="12" height="185" fill="white" stroke="black"/><rect x="125" y="3035" width="3085" height="28" fill="white" stroke="none"/><text x="133" y="3054" text-anchor="start" font-size="15"><tspan x="133" dy="0">[reward conditions are not satisfied — UC-24 A1]</tspan></text><rect x="1781" y="3135" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3336" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="3870" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="490" width="378" height="48" fill="white" stroke="none"/><text x="340" y="509" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Answer / interact according to the game</tspan><tspan x="340" dy="20">rules</tspan></text><path d="M142,550L538,550" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="615" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="634" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">2: Provide the action for checking against the game rules</tspan></text><path d="M552,655L1768,655" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="720" width="275" height="28" fill="white" stroke="none"/><text x="1899" y="739" text-anchor="start" font-size="15"><tspan x="1899" dy="0">3: Check the Student&apos;s action</tspan></text><path d="M1782,734h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="825" width="275" height="28" fill="white" stroke="none"/><text x="1899" y="844" text-anchor="start" font-size="15"><tspan x="1899" dy="0">4: Update the current score</tspan></text><path d="M1782,839h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="930" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="949" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">5: Action result and current score</tspan></text><path d="M1768,970L552,970" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1035" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1054" text-anchor="middle" font-size="15"><tspan x="340" dy="0">6: Display the current game state</tspan></text><path d="M538,1075L142,1075" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1195" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1214" text-anchor="middle" font-size="15"><tspan x="340" dy="0">7: Exit the game</tspan></text><path d="M142,1235L538,1235" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1300" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="1319" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">8: End the current game session</tspan></text><path d="M552,1340L1768,1340" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="1405" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="1424" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Do not grant a</tspan><tspan x="1899" dy="20">completed-game reward</tspan></text><path d="M1782,1439h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1530" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="1549" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">10: Session ended</tspan></text><path d="M1768,1570L552,1570" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1635" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1654" text-anchor="middle" font-size="15"><tspan x="340" dy="0">11: Leave the game interface</tspan></text><path d="M538,1675L142,1675" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1830" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1849" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Complete the game when its completion</tspan><tspan x="750" dy="20">condition is reached</tspan></text><path d="M552,1890L948,1890" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="1955" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1974" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">13: Forward the session completion request</tspan></text><path d="M962,1995L1358,1995" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2060" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2079" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">14: Process the completed game</tspan></text><path d="M1372,2100L1768,2100" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2165" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2184" text-anchor="start" font-size="15"><tspan x="1899" dy="0">15: Calculate the final score</tspan><tspan x="1899" dy="20">and correct answer count —</tspan><tspan x="1899" dy="20">BR66</tspan></text><path d="M1782,2219h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2310" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2329" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">16: Read the configured reward conditions</tspan><tspan x="1980" dy="20">and amounts</tspan></text><path d="M1782,2370L2178,2370" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2435" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2454" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">17: Configured reward conditions and coin</tspan><tspan x="1980" dy="20">amount</tspan></text><path d="M2178,2495L1782,2495" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2560" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="2579" text-anchor="start" font-size="15"><tspan x="1899" dy="0">18: Evaluate the reward</tspan><tspan x="1899" dy="20">conditions — BR68–69</tspan></text><path d="M1782,2594h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2740" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2759" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">19: Award the eligible completed activity once</tspan></text><path d="M1782,2780L2998,2780" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2925" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2944" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">20: Coins awarded according to the ledger outcome</tspan></text><path d="M2998,2965L1782,2965" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="3086" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="3105" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21: Grant no coins; continue</tspan><tspan x="1899" dy="20">storing and displaying the</tspan><tspan x="1899" dy="20">result</tspan></text><path d="M1782,3140h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3276" width="788" height="48" fill="white" stroke="none"/><text x="2185" y="3295" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">22: Store game, scope, score, correct count, coins earned and incorrectly answered</tspan><tspan x="2185" dy="20">questions</tspan></text><path d="M1782,3336L2588,3336" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3401" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3420" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">23: Game result stored — BR71</tspan></text><path d="M2588,3441L1782,3441" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3506" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3525" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">24: Completed-game result and review data</tspan></text><path d="M1768,3546L1372,3546" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3611" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3630" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">25: Completed-game result and review data</tspan></text><path d="M1358,3651L962,3651" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3716" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3735" text-anchor="middle" font-size="15"><tspan x="750" dy="0">26: Completed-game result and review data</tspan></text><path d="M948,3756L552,3756" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="3821" width="275" height="68" fill="white" stroke="none"/><text x="669" y="3840" text-anchor="start" font-size="15"><tspan x="669" dy="0">27: Display Student answers,</tspan><tspan x="669" dy="20">incorrect answers and</tspan><tspan x="669" dy="20">available explanations — BR72</tspan></text><path d="M552,3875h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="3966" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3985" text-anchor="middle" font-size="15"><tspan x="340" dy="0">28: Display the final score, correct</tspan><tspan x="340" dy="20">answer count and coins earned</tspan></text><path d="M538,4026L142,4026" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>