<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="5042" viewBox="0 0 3255 5042"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4987" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="665" width="3205" height="4272" fill="none" stroke="black"/><rect x="39" y="1450" width="3177" height="675" fill="none" stroke="black"/><rect x="39" y="2260" width="3177" height="2632" fill="none" stroke="black"/><rect x="53" y="3121" width="3149" height="436" fill="none" stroke="black"/><rect x="53" y="4172" width="3149" height="215" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">StudentLearningProgressPage</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">progressApi.ts</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«controller»</tspan><tspan x="1365" dy="20">:LearningProgressController</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="257.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«service»</tspan><tspan x="1775" dy="20">:LearningProgressService</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«repository»</tspan><tspan x="2185" dy="20">:LearningRecordRepository</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«repository»</tspan><tspan x="2595" dy="20">:PracticeStatisticsRepository</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«repository»</tspan><tspan x="3005" dy="20">:LearningHabitRepository</tspan></text><rect x="50" y="355" width="3155" height="50" fill="white" stroke="none"/><text x="58" y="385" text-anchor="start" font-size="15"><tspan x="58" dy="0">Source records under NF1–5: first completions, non-duplicated new knowledge, individual practice attempts and actual learning days. Activity recording is detailed in SD-12.3.</tspan></text><path d="M39,2920L3216,2920" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,3361L3202,3361" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="467" width="12" height="4361" fill="white" stroke="black"/><rect x="949" y="877" width="12" height="3806" fill="white" stroke="black"/><rect x="1359" y="1002" width="12" height="3576" fill="white" stroke="black"/><rect x="1769" y="1272" width="12" height="3201" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.1 View learning progress</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-26 NF1–13, A1–A3, E1; BR106–107, BR110, BR114, BR117–118</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: valid session, required role, active Student account; JWT authentication under Section 5.2.1. Viewing progress does not modify completion records or practice results.</tspan></text><rect x="551" y="569" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="665" width="90" height="30" fill="white" stroke="black"/><text x="33" y="685" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="667" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="686" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Student selects / changes the statistics scope — NF8–13]</tspan></text><rect x="1371" y="1144" width="12" height="45" fill="white" stroke="black"/><rect x="39" y="1450" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1470" text-anchor="start" font-size="15"><tspan x="47" dy="0">break</tspan></text><rect x="141" y="1452" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="1471" text-anchor="start" font-size="15"><tspan x="149" dy="0">[learning records cannot be loaded — E1 / BR118]</tspan></text><rect x="2179" y="1385" width="12" height="160" fill="white" stroke="black"/><rect x="39" y="2260" width="90" height="30" fill="white" stroke="black"/><text x="47" y="2280" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="2262" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="2281" text-anchor="start" font-size="15"><tspan x="149" dy="0">[no learning records match the selected filters — A1]</tspan></text><rect x="1781" y="2384" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="2925" width="3057" height="28" fill="white" stroke="none"/><text x="147" y="2944" text-anchor="start" font-size="15"><tspan x="147" dy="0">[learning data is available]</tspan></text><rect x="1781" y="3025" width="12" height="45" fill="white" stroke="black"/><rect x="53" y="3121" width="90" height="30" fill="white" stroke="black"/><text x="61" y="3141" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="3123" width="3029" height="28" fill="white" stroke="none"/><text x="163" y="3142" text-anchor="start" font-size="15"><tspan x="163" dy="0">[required activities are defined for the selected scope]</tspan></text><rect x="1781" y="3265" width="12" height="45" fill="white" stroke="black"/><rect x="153" y="3366" width="3029" height="28" fill="white" stroke="none"/><text x="161" y="3385" text-anchor="start" font-size="15"><tspan x="161" dy="0">[no required activities are defined — A2]</tspan></text><rect x="1781" y="3446" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3627" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="3866" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="4002" width="12" height="105" fill="white" stroke="black"/><rect x="53" y="4172" width="90" height="30" fill="white" stroke="black"/><text x="61" y="4192" text-anchor="start" font-size="15"><tspan x="61" dy="0">opt</tspan></text><rect x="155" y="4174" width="3029" height="28" fill="white" stroke="none"/><text x="163" y="4193" text-anchor="start" font-size="15"><tspan x="163" dy="0">[active study time tracking is implemented — A3 / BR114]</tspan></text><rect x="1781" y="4276" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="435" width="378" height="28" fill="white" stroke="none"/><text x="340" y="454" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select Learning Progress</tspan></text><path d="M142,475L538,475" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="540" width="275" height="48" fill="white" stroke="none"/><text x="669" y="559" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: initializeFilters({period,</tspan><tspan x="669" dy="20">courseId, chapterId})</tspan></text><path d="M552,574h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="720" width="378" height="48" fill="white" stroke="none"/><text x="340" y="739" text-anchor="middle" font-size="15"><tspan x="340" dy="0">3: Select the time period, course and</tspan><tspan x="340" dy="20">chapter</tspan></text><path d="M142,780L538,780" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="845" width="378" height="28" fill="white" stroke="none"/><text x="750" y="864" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: getLearningProgress(filters)</tspan></text><path d="M552,885L948,885" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="950" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="969" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">5: getLearningProgress(filters,</tspan><tspan x="1160" dy="20">authentication)</tspan></text><path d="M962,1010L1358,1010" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="1075" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="1094" text-anchor="start" font-size="15"><tspan x="1489" dy="0">6:</tspan><tspan x="1489" dy="20">requireStudent(authentication)</tspan><tspan x="1489" dy="20">=&gt; studentId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,1149h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1240" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1259" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">7: getLearningProgress(studentId, filters)</tspan></text><path d="M1372,1280L1768,1280" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1345" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1364" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">8: findCompletionData(studentId, filters)</tspan></text><path d="M1782,1385L2178,1385" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1505" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1524" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">9: failure: Retrieval error</tspan></text><path d="M2178,1545L1782,1545" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1610" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1629" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: failure: Display a loading failure; do</tspan><tspan x="1570" dy="20">not represent missing data as 0% progress</tspan></text><path d="M1768,1670L1372,1670" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1735" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1754" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: failure: Display a loading failure; do</tspan><tspan x="1160" dy="20">not represent missing data as 0% progress</tspan></text><path d="M1358,1795L962,1795" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1860" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1879" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: failure: Display a loading failure; do</tspan><tspan x="750" dy="20">not represent missing data as 0% progress</tspan></text><path d="M948,1920L552,1920" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1985" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2004" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: Display a loading failure; do not</tspan><tspan x="340" dy="20">represent missing data as 0% progress</tspan></text><path d="M538,2045L142,2045" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="2155" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2174" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">14: completionData: CompletionData</tspan></text><path d="M2178,2195L1782,2195" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2315" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="2334" text-anchor="start" font-size="15"><tspan x="1899" dy="0">15: buildNoDataStatistics(</tspan><tspan x="1899" dy="20">{activityCounts: 0,</tspan><tspan x="1899" dy="20">practiceResults: null}) =&gt;</tspan><tspan x="1899" dy="20">progress: LearningProgressDTO</tspan></text><path d="M1782,2389h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2480" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2499" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">16: progress: LearningProgressDTO</tspan></text><path d="M1768,2520L1372,2520" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2585" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="2604" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">17: progress: LearningProgressDTO</tspan></text><path d="M1358,2625L962,2625" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2690" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2709" text-anchor="middle" font-size="15"><tspan x="750" dy="0">18: progress: LearningProgressDTO</tspan></text><path d="M948,2730L552,2730" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2795" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2814" text-anchor="middle" font-size="15"><tspan x="340" dy="0">19: Clearly indicate no data; do not</tspan><tspan x="340" dy="20">substitute zero practice scores</tspan></text><path d="M538,2855L142,2855" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2976" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2995" text-anchor="start" font-size="15"><tspan x="1899" dy="0">20: countFirstLearnedItems(</tspan><tspan x="1899" dy="20">completionData, filters) =&gt;</tspan><tspan x="1899" dy="20">knowledge: NewKnowledgeCounts</tspan></text><path d="M1782,3030h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="3176" width="275" height="108" fill="white" stroke="none"/><text x="1899" y="3195" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21:</tspan><tspan x="1899" dy="20">calculateCompletionPercentage(</tspan><tspan x="1899" dy="20">completedRequiredCount,</tspan><tspan x="1899" dy="20">requiredActivityCount) =&gt;</tspan><tspan x="1899" dy="20">completionPercentage: number</tspan></text><path d="M1782,3270h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="3417" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="3436" text-anchor="start" font-size="15"><tspan x="1899" dy="0">22:</tspan><tspan x="1899" dy="20">setCompletionPercentage(null)</tspan></text><path d="M1782,3451h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3587" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3606" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">23: findPracticeStatistics(studentId, filters)</tspan></text><path d="M1782,3627L2588,3627" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3692" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3711" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">24: practiceData: PracticeStatisticsData</tspan></text><path d="M2588,3732L1782,3732" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="3797" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="3816" text-anchor="start" font-size="15"><tspan x="1899" dy="0">25: summarizeAttempts(</tspan><tspan x="1899" dy="20">practiceData.attempts) =&gt;</tspan><tspan x="1899" dy="20">attemptStats:</tspan><tspan x="1899" dy="20">AttemptStatistics</tspan></text><path d="M1782,3871h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3962" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="3981" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">26: findLearningHabits(studentId, filters)</tspan></text><path d="M1782,4002L2998,4002" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="4067" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="4086" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">27: habits: LearningHabitData</tspan></text><path d="M2998,4107L1782,4107" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="4227" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="4246" text-anchor="start" font-size="15"><tspan x="1899" dy="0">28: calculateActiveStudyTime(</tspan><tspan x="1899" dy="20">habits.activeStudyRecords) =&gt;</tspan><tspan x="1899" dy="20">activeStudyTime: Duration</tspan></text><path d="M1782,4281h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="4417" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="4436" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">29: progress: LearningProgressDTO</tspan></text><path d="M1768,4457L1372,4457" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="4522" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="4541" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">30: progress: LearningProgressDTO</tspan></text><path d="M1358,4562L962,4562" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="4627" width="378" height="28" fill="white" stroke="none"/><text x="750" y="4646" text-anchor="middle" font-size="15"><tspan x="750" dy="0">31: progress: LearningProgressDTO</tspan></text><path d="M948,4667L552,4667" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="4732" width="378" height="68" fill="white" stroke="none"/><text x="340" y="4751" text-anchor="middle" font-size="15"><tspan x="340" dy="0">32: Display statistics matching the</tspan><tspan x="340" dy="20">selected filters, including learning-day</tspan><tspan x="340" dy="20">streak information</tspan></text><path d="M538,4812L142,4812" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>