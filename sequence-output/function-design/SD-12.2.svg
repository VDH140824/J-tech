<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="2656" viewBox="0 0 2845 2656"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,2601" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1525" width="2795" height="1026" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">StudentStreakPage</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">streakApi.ts</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«controller»</tspan><tspan x="1365" dy="20">:StreakController</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="257.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«service»</tspan><tspan x="1775" dy="20">:StreakService</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«repository»</tspan><tspan x="2185" dy="20">:UserStreakRepository</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«repository»</tspan><tspan x="2595" dy="20">:StreakMilestoneRepository</tspan></text><path d="M25,2020L2820,2020" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="2100" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="1850" fill="white" stroke="black"/><rect x="1359" y="597" width="12" height="1640" fill="white" stroke="black"/><rect x="1769" y="867" width="12" height="1265" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.2 View login streak</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-27 NF1–6, A1; BR108–109; §5.2.5</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: valid session, required role, active Student account; JWT authentication under Section 5.2.1. BR109: viewing neither updates the streak nor grants coins. UC-27 uses &apos;login streak&apos;; BR108 uses &apos;learning streak&apos;.</tspan></text><rect x="1371" y="739" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="980" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1190" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="1429" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1525" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1545" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1527" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1546" text-anchor="start" font-size="15"><tspan x="135" dy="0">[a next reward milestone is available]</tspan></text><rect x="125" y="2025" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="2044" text-anchor="start" font-size="15"><tspan x="133" dy="0">[no next reward milestone is available — A1]</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select Login Streak</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: getStreakSummary()</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: getStreakSummary(authentication)</tspan></text><path d="M962,605L1358,605" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="670" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="689" text-anchor="start" font-size="15"><tspan x="1489" dy="0">4:</tspan><tspan x="1489" dy="20">requireStudent(authentication)</tspan><tspan x="1489" dy="20">=&gt; studentId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,744h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="835" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="854" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">5: getStreakSummary(studentId)</tspan></text><path d="M1372,875L1768,875" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="940" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="959" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: findByStudentId(studentId)</tspan></text><path d="M1782,980L2178,980" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1045" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1064" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: streak: UserStreak</tspan></text><path d="M2178,1085L1782,1085" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1150" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1169" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: findConfiguredMilestones()</tspan></text><path d="M1782,1190L2588,1190" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1255" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1274" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">9: milestones: List&lt;StreakMilestone&gt;</tspan></text><path d="M2588,1295L1782,1295" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="1360" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="1379" text-anchor="start" font-size="15"><tspan x="1899" dy="0">10: findNextMilestone(</tspan><tspan x="1899" dy="20">streak.currentStreak,</tspan><tspan x="1899" dy="20">milestones) =&gt; nextMilestone:</tspan><tspan x="1899" dy="20">Optional&lt;StreakMilestone&gt;</tspan></text><path d="M1782,1434h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1580" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1599" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">11: summary: StreakSummary</tspan></text><path d="M1768,1620L1372,1620" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1685" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1704" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">12: summary: StreakSummary</tspan></text><path d="M1358,1725L962,1725" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1790" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1809" text-anchor="middle" font-size="15"><tspan x="750" dy="0">13: summary: StreakSummary</tspan></text><path d="M948,1830L552,1830" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1895" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1914" text-anchor="middle" font-size="15"><tspan x="340" dy="0">14: Display current streak, longest</tspan><tspan x="340" dy="20">streak, next milestone and its coin reward</tspan></text><path d="M538,1955L142,1955" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2076" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2095" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">15: summary: StreakSummary</tspan></text><path d="M1768,2116L1372,2116" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2181" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="2200" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">16: summary: StreakSummary</tspan></text><path d="M1358,2221L962,2221" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2286" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2305" text-anchor="middle" font-size="15"><tspan x="750" dy="0">17: summary: StreakSummary</tspan></text><path d="M948,2326L552,2326" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2391" width="378" height="68" fill="white" stroke="none"/><text x="340" y="2410" text-anchor="middle" font-size="15"><tspan x="340" dy="0">18: Display current and longest streaks;</tspan><tspan x="340" dy="20">indicate that no next milestone is</tspan><tspan x="340" dy="20">available</tspan></text><path d="M538,2471L142,2471" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>