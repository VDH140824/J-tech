er-end="url(#block)"/><rect x="1791" y="3721" width="2018" height="28" fill="white" stroke="none"/><text x="2800" y="3740" text-anchor="middle" font-size="15"><tspan x="2800" dy="0">25: award: CoinAwardResult</tspan></text><path d="M3818,3761L1782,3761" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="4007" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="4026" text-anchor="start" font-size="15"><tspan x="1899" dy="0">26:</tspan><tspan x="1899" dy="20">keepStreakForAlreadyCountedDay(</tspan><tspan x="1899" dy="20">dayState)</tspan></text><path d="M1782,4061h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="4197" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="4216" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">27: result: CompletionRecordingResult</tspan></text><path d="M1768,4237L1372,4237" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="4302" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="4321" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">28: result: CompletionRecordingResult</tspan></text><path d="M1358,4342L962,4342" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="4407" width="378" height="28" fill="white" stroke="none"/><text x="750" y="4426" text-anchor="middle" font-size="15"><tspan x="750" dy="0">29: result: CompletionRecordingResult</tspan></text><path d="M948,4447L552,4447" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="4512" width="378" height="28" fill="white" stroke="none"/><text x="340" y="4531" text-anchor="middle" font-size="15"><tspan x="340" dy="0">30: Completed activity recorded</tspan></text><path d="M538,4552L142,4552" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>