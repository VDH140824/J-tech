text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">LearningActivityPage</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">progressApi.ts</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«controller»</tspan><tspan x="1365" dy="20">:LearningActivityController</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="257.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«service»</tspan><tspan x="1775" dy="20">:LearningActivityService</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«repository»</tspan><tspan x="2185" dy="20">:LearningProgressRepository</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«repository»</tspan><tspan x="2595" dy="20">:PracticeAttemptRepository</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«repository»</tspan><tspan x="3005" dy="20">:LearningDayStreakRepository</tspan></text><rect x="3255" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3415" y="257.5" text-anchor="middle" font-size="15"><tspan x="3415" dy="0">«service»</tspan><tspan x="3415" dy="20">:StreakMilestoneService</tspan></text><rect x="3665" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3825" y="257.5" text-anchor="middle" font-size="15"><tspan x="3825" dy="0">«service»</tspan><tspan x="3825" dy="20">:CoinRewardService</tspan></text><path d="M39,1755L4036,1755" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="3826" width="3975" height="50" fill="white" stroke="black"/><path d="M25,3951L4050,3951" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="4161" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="3951" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="3721" fill="white" stroke="black"/><rect x="1769" y="927" width="12" height="3326" fill="white" stroke="black"/><rect x="3409" y="3383" width="12" height="129" fill="white" stroke="black"/><rect x="3819" y="3648" width="12" height="129" fill="white" stroke="black"/><rect x="30" y="10" width="4015" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.3 Record activity &amp; update learning streak</tspan></text><rect x="30" y="58" width="4015" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-26 NF1–5; BR43, BR45, BR106–107, BR112; §3.1.5; §5.2.5</tspan></text><rect x="30" y="98" width="4015" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="4015" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR112 excludes login and merely opening a lesson. NS-02 mentions qualifying login, which conflicts with BR112; this diagram shows BR112&apos;s learning-day rule. No unspecified streak initialization or freeze mechanism is added.</tspan></text><rect x="1371" y="779" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="1069" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1165" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1185" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="1167" width="3905" height="28" fill="white" stroke="none"/><text x="135" y="1186" text-anchor="start" font-size="15"><tspan x="135" dy="0">[learning content is completed — UC-26 NF1–2]</tspan></text><rect x="2179" y="1280" width="12" height="125" fill="white" stroke="black"/><rect x="39" y="1470" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1490" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1472" width="3877" height="28" fill="white" stroke="none"/><text x="149" y="1491" text-anchor="start" font-size="15"><tspan x="149" dy="0">[content / knowledge is completed for the first time]</tspan></text><rect x="2179" y="1585" width="12" height="105" fill="white" stroke="black"/><rect x="139" y="1760" width="3877" height="28" fill="white" stroke="none"/><text x="147" y="1779" text-anchor="start" font-size="15"><tspan x="147" dy="0">[content was completed previously — BR106]</tspan></text><rect x="1781" y="1860" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2046" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2066" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="2048" width="3905" height="28" fill="white" stroke="none"/><text x="135" y="2067" text-anchor="start" font-size="15"><tspan x="135" dy="0">[a practice attempt is completed — NF3–4 / BR107]</tspan></text><rect x="2589" y="2161" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="2360" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="2541" width="12" height="105" fill="white" stroke="black"/><rect x="2999" y="2751" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="2921" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2941" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2923" width="3905" height="28" fill="white" stroke="none"/><text x="135" y="2942" text-anchor="start" font-size="15"><tspan x="135" dy="0">[the current day has not yet counted toward the learning streak]</tspan></text><rect x="1781" y="3045" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="3181" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3561" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3581" text-anchor="start" font-size="15"><tspan x="47" dy="0">opt</tspan></text><rect x="141" y="3563" width="3877" height="28" fill="white" stroke="none"/><text x="149" y="3582" text-anchor="start" font-size="15"><tspan x="149" dy="0">[a milestone not yet rewarded in this streak is reached]</tspan></text><rect x="50" y="3826" width="75" height="28" fill="white" stroke="black"/><text x="58" y="3845" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="3830" width="3865" height="28" fill="white" stroke="none"/><text x="148" y="3849" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-13.2 — Award the configured milestone coins once per unbroken learning streak</tspan></text><rect x="125" y="3956" width="3905" height="28" fill="white" stroke="none"/><text x="133" y="3975" text-anchor="start" font-size="15"><tspan x="133" dy="0">[the current day has already been counted — BR112]</tspan></text><rect x="1781" y="4056" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Complete a learning / practice</tspan><tspan x="340" dy="20">activit