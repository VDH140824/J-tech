. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Precondition: authenticated Moderator with the required privileges. Read-only. UC-48 status filters: Pending / In Progress / Resolved / Rejected.</tspan></text><rect x="1371" y="759" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="989" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1145" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1355" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1985" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2005" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="1987" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="2006" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Moderator changes search / filter criteria]</tspan></text><rect x="551" y="2194" width="12" height="45" fill="white" stroke="black"/><rect x="1371" y="2629" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2919" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="3055" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3225" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3245" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="3227" width="2647" height="28" fill="white" stroke="none"/><text x="149" y="3246" text-anchor="start" font-size="15"><tspan x="149" dy="0">[matching results exist]</tspan></text><rect x="139" y="3705" width="2647" height="28" fill="white" stroke="none"/><text x="147" y="3724" text-anchor="start" font-size="15"><tspan x="147" dy="0">[no matching records are found — A5a]</tspan></text><rect x="50" y="4411" width="75" height="28" fill="white" stroke="black"/><text x="58" y="4430" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="4415" width="2635" height="28" fill="white" stroke="none"/><text x="148" y="4434" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-17.2 — View content feedback detail</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Select Content Feedback</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: listContentFeedback(query)</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: listContentFeedback(query,</tspan><tspan x="1160" dy="20">authentication)</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="690" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="709" text-anchor="start" font-size="15"><tspan x="1489" dy="0">4: requireModerator(</tspan><tspan x="1489" dy="20">authentication) =&gt;</tspan><tspan x="1489" dy="20">moderatorId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,764h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="855" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="874" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">5: listContentFeedback(moderatorId, query)</tspan></text><path d="M1372,895L1768,895" fill="none" s