<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="4566" viewBox="0 0 2845 4566"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4511" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1985" width="2795" height="2271" fill="none" stroke="black"/><rect x="39" y="3225" width="2767" height="986" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">ModeratorContentFeedbackListPage</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">contentFeedbackApi.ts</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5"