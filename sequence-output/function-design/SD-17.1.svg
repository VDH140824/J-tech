d, pageRequest})</tspan></text><path d="M552,2350L948,2350" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2415" width="378" height="68" fill="white" stroke="none"/><text x="1160" y="2434" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">18: listContentFeedback({courseId,</tspan><tspan x="1160" dy="20">lessonId, status, keyword, pageRequest},</tspan><tspan x="1160" dy="20">authentication)</tspan></text><path d="M962,2495L1358,2495" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="2560" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="2579" text-anchor="start" font-size="15"><tspan x="1489" dy="0">19: requireModerator(</tspan><tspan x="1489" dy="20">authentication) =&gt;</tspan><tspan x="1489" dy="20">moderatorId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,2634h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2725" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="2744" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">20: listContentFeedback(moderatorId,</tspan><tspan x="1570" dy="20">query)</tspan></text><path d="M1372,2785L1768,2785" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2850" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="2869" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21:</tspan><tspan x="1899" dy="20">buildAcademicFeedbackCriteria(</tspan><tspan x="1899" dy="20">query) =&gt; criteria:</tspan><tspan x="1899" dy="20">FeedbackSearchCriteria</tspan></text><path d="M1782,2924h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3015" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="3034" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">22: searchContentFeedback(criteria)</tspan></text><path d="M1782,3055L2178,3055" fill="none" stroke="black"  