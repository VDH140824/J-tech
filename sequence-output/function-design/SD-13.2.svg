<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2717" viewBox="0 0 1615 2717"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,2662" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,2662" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,2662" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,2662" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="685" width="1565" height="1927" fill="none" stroke="black"/><rect x="39" y="970" width="1537" height="1597" fill="none" stroke="black"/><rect x="53" y="1726" width="1509" height="796" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Reward-eligible activity</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«service»</tspan><tspan x="545" dy="20">:CoinRewardService</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«repository»</tspan><tspan x="955" dy="20">:CoinTransactionRepository</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«repository»</tspan><tspan x="1365" dy="20">:UserRewardBalanceRepository</tspan></text><rect x="50" y="480" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="510" text-anchor="start" font-size="15"><tspan x="58" dy="0">The calling flow applies configured reward conditions and amounts. BR40: first successful completion; BR45: each milestone once per unbroken learning streak.</tspan></text><path d="M39,1275L1576,1275" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,2096L1562,2096" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="2051" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-13.2 Award coins with idempotent ledger</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: NS-08 Coin_EXP_Transaction_Ledger; BR40, BR45, BR68–69; §4 Data Integrity</tspan></text><rect x="30" y="98" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC /</tspan><tspan x="38" dy="19">BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="149" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="167" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR45 specifies streak milestone rewards; NS-08 describes exercise / game completion. Award-key format and reward amounts remain configurable. Coin / EXP amounts are supplied by the applicable</tspan><tspan x="38" dy="19">reward allocation; no EXP formula is specified. Award-key uniqueness must be protected atomically as required by NS-08.</tspan></text><rect x="551" y="589" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="685" width="90" height="30" fill="white" stroke="black"/><text x="33" y="705" text-anchor="start" font-size="15"><tspan x="33" dy="0">critical</tspan></text><rect x="127" y="687" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="706" text-anchor="start" font-size="15"><tspan x="135" dy="0">[ACID transaction with idempotency protection — NS-08 / Section 4]</tspan></text><rect x="949" y="780" width="12" height="125" fill="white" stroke="black"/><rect x="39" y="970" width="90" height="30" fill="white" stroke="black"/><text x="47" y="990" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="972" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="991" text-anchor="start" font-size="15"><tspan x="149" dy="0">[the award key already exists]</tspan></text><rect x="551" y="1054" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1280" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1299" text-anchor="start" font-size="15"><tspan x="147" dy="0">[the award key does not exist]</tspan></text><rect x="1359" y="1371" width="12" height="105" fill="white" stroke="black"/><rect x="53" y="1726" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1746" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1728" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1747" text-anchor="start" font-size="15"><tspan x="163" dy="0">[all updates succeed]</tspan></text><rect x="949" y="1661" width="12" height="160" fill="white" stroke="black"/><rect x="551" y="1895" width="12" height="45" fill="white" stroke="black"/><rect x="153" y="2101" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="2120" text-anchor="start" font-size="15"><tspan x="161" dy="0">[the transaction cannot be completed]</tspan></text><rect x="551" y="2286" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: awardCoins(studentId, activityRef,</tspan><tspan x="340" dy="20">rewardAllocation, awardKey)</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="560" width="275" height="48" fill="white" stroke="none"/><text x="669" y="579" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: validateAwardKey(studentId,</tspan><tspan x="669" dy="20">activityRef, awardKey)</tspan></text><path d="M552,594h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="740" width="378" height="28" fill="white" stroke="none"/><text x="750" y="759" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: findByAwardKey(awardKey)</tspan></text><path d="M552,780L948,780" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="845" width="378" height="48" fill="white" stroke="none"/><text x="750" y="864" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: existingAward:</tspan><tspan x="750" dy="20">Optional&lt;CoinTransaction&gt;</tspan></text><path d="M948,905L552,905" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1025" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1044" text-anchor="start" font-size="15"><tspan x="669" dy="0">5: reuseExistingAward(</tspan><tspan x="669" dy="20">existingAward)</tspan></text><path d="M552,1059h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1150" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1169" text-anchor="middle" font-size="15"><tspan x="340" dy="0">6: Do not grant a duplicate reward for the</tspan><tspan x="340" dy="20">same key</tspan></text><path d="M538,1210L142,1210" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1331" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1350" text-anchor="middle" font-size="15"><tspan x="955" dy="0">7: creditCoinsAndExp(studentId, rewardAllocation.coinAmount, rewardAllocation.expAmount)</tspan></text><path d="M552,1371L1358,1371" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1436" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1455" text-anchor="middle" font-size="15"><tspan x="955" dy="0">8: balances: RewardBalances</tspan></text><path d="M1358,1476L552,1476" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1541" width="378" height="108" fill="white" stroke="none"/><text x="750" y="1560" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: save(CoinTransaction{studentId,</tspan><tspan x="750" dy="20">direction: EARN, amount:</tspan><tspan x="750" dy="20">rewardAllocation.coinAmount, balanceAfter:</tspan><tspan x="750" dy="20">balances.coinBalance, activityRef,</tspan><tspan x="750" dy="20">awardKey})</tspan></text><path d="M552,1661L948,1661" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1781" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1800" text-anchor="middle" font-size="15"><tspan x="750" dy="0">10: transaction: CoinTransaction</tspan></text><path d="M948,1821L552,1821" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1886" width="275" height="28" fill="white" stroke="none"/><text x="669" y="1905" text-anchor="start" font-size="15"><tspan x="669" dy="0">11: commitRewardTransaction()</tspan></text><path d="M552,1900h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1991" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2010" text-anchor="middle" font-size="15"><tspan x="340" dy="0">12: Committed reward allocation result</tspan></text><path d="M538,2031L142,2031" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2152" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2171" text-anchor="middle" font-size="15"><tspan x="750" dy="0">13: failure: Transaction failed</tspan></text><path d="M948,2192L552,2192" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="2257" width="275" height="48" fill="white" stroke="none"/><text x="669" y="2276" text-anchor="start" font-size="15"><tspan x="669" dy="0">14:</tspan><tspan x="669" dy="20">rollbackRewardTransaction()</tspan></text><path d="M552,2291h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="2382" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2401" text-anchor="middle" font-size="15"><tspan x="340" dy="0">15: Reward allocation failed; preserve</tspan><tspan x="340" dy="20">pre-transaction data</tspan></text><path d="M538,2442L142,2442" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>