ContentFeedback(moderatorId,</tspan><tspan x="1570" dy="20">feedbackId)</tspan></text><path d="M1372,935L1768,935" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1000" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1019" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: findContentFeedbackDetail(feedbackId)</tspan></text><path d="M1782,1040L2178,1040" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1105" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1124" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: feedback: ContentFeedbackRecord</tspan></text><path d="M2178,1145L1782,1145" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1210" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1229" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: findReportedContentContext(feedback.contentRef)</tspan></text><path d="M1782,1250L2588,1250" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1315" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1334" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">9: context: ReportedContentContext</tspan></text><path d="M2588,1355L1782,1355" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1420" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1439" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: detail: ContentFeedbackDetail</tspan></text><path d="M1768,1460L1372,1460" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1525" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1544" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: detail: ContentFeedbackDetail</tspan></text><path d="M1358,1565L962,1565" fill="none" stroke="black" stroke-dasharray="7