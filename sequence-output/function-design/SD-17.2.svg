tation. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: authenticated Moderator; a content feedback ticket is selected. Read-only: do not change ticket status. UC-49 refers to UC-95 for the list, whose actual title is UC-48.</tspan></text><rect x="1371" y="779" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1040" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1250" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="1824" width="12" height="45" fill="white" stroke="black"/><rect x="551" y="1969" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2065" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2085" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2067" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="2086" text-anchor="start" font-size="15"><tspan x="135" dy="0">[image attachments exist]</tspan></text><rect x="551" y="2149" width="12" height="45" fill="white" stroke="black"/><rect x="125" y="2250" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="2269" text-anchor="start" font-size="15"><tspan x="133" dy="0">[no images are attached — A2a]</tspan></text><rect x="551" y="2310" width="12" height="45" fill="white" stroke="black"/><rect x="1371" y="2980" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3241" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="3411" width="90" height="30" fill="white" stroke="black"/><text x="33" y="3431" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="3413" width="2675" height="28" fill="white" s