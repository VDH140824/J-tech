 x="340" dy="20">and learning-material links</tspan></text><path d="M538,2511L142,2511" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2576" width="378" height="28" fill="white" stroke="none"/><text x="340" y="2595" text-anchor="middle" font-size="15"><tspan x="340" dy="0">18: Select View Lecture</tspan></text><path d="M142,2616L538,2616" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="2681" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2700" text-anchor="middle" font-size="15"><tspan x="750" dy="0">19: getReportedContentLink(feedbackId)</tspan></text><path d="M552,2721L948,2721" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="2786" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2805" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">20: getReportedContentLink(feedbackId,</tspan><tspan x="1160" dy="20">authentication)</tspan></text><path d="M962,2846L1358,2846" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="2911" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="2930" text-anchor="start" font-size="15"><tspan x="1489" dy="0">21: requireModerator(</tspan><tspan x="1489" dy="20">authentication) =&gt;</tspan><tspan x="1489" dy="20">moderatorId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,2985h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="3076" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="3095" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">22: getReportedContentLink(moderatorId,</tspan><tspan x="1570" dy="20">feedbackId)</tspan></text><path d="M1372,3136L1768,3136" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3201" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3220" text-anchor="middle" font-size="15"><tspan