<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2052" viewBox="0 0 1615 2052"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,1997" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,1997" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,1997" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,1997" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="835" width="1565" height="1112" fill="none" stroke="black"/><rect x="39" y="1100" width="1537" height="802" fill="none" stroke="black"/><rect x="53" y="1316" width="1509" height="541" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Scheduler</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«service»</tspan><tspan x="545" dy="20">:DailyStreakResetJob</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«repository»</tspan><tspan x="955" dy="20">:UserStreakRepository</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«repository»</tspan><tspan x="1365" dy="20">:LearningDayRepository</tspan></text><path d="M39,1260L1576,1260" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,1581L1562,1581" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="1762" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="1792" text-anchor="start" font-size="15"><tspan x="58" dy="0">BR74 refers to BR146, which is absent from the supplied SRS. Freeze activation, expiry and consumption are therefore not specified here.</tspan></text><rect x="539" y="407" width="12" height="1306" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.4 Daily streak reset job</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: NS-02 Daily_Streak_Reset_Job; BR43, BR74, BR112; §5.2.5</tspan></text><rect x="30" y="98" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC /</tspan><tspan x="38" dy="19">BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="149" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="167" text-anchor="start" font-size="14"><tspan x="38" dy="0">Unresolved source conflict: NS-02 accepts qualifying login or completed study and states CurrentDate − LastLearningDate &gt; 1; BR112 excludes login. Eligibility here follows BR74 / BR112;</tspan><tspan x="38" dy="19">execution time follows NS-02.</tspan></text><rect x="551" y="529" width="12" height="45" fill="white" stroke="black"/><rect x="949" y="665" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="835" width="90" height="30" fill="white" stroke="black"/><text x="33" y="855" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="837" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="856" text-anchor="start" font-size="15"><tspan x="135" dy="0">[for each Student in User_Streak]</tspan></text><rect x="1359" y="930" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="1100" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1120" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1102" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="1121" text-anchor="start" font-size="15"><tspan x="149" dy="0">[the preceding day has a qualifying completion — BR112]</tspan></text><rect x="551" y="1164" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1265" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1284" text-anchor="start" font-size="15"><tspan x="147" dy="0">[the preceding day has no qualifying completion — BR74]</tspan></text><rect x="53" y="1316" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1336" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1318" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1337" text-anchor="start" font-size="15"><tspan x="163" dy="0">[the streak is not preserved by a streak-freeze item]</tspan></text><rect x="949" y="1411" width="12" height="105" fill="white" stroke="black"/><rect x="153" y="1586" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="1605" text-anchor="start" font-size="15"><tspan x="161" dy="0">[the streak is preserved under the streak-freeze exception in BR74]</tspan></text><rect x="551" y="1666" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: runDailyReset() — scheduled at 00:00:01</tspan><tspan x="340" dy="20">GMT+7</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="480" width="275" height="68" fill="white" stroke="none"/><text x="669" y="499" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: currentDate(</tspan><tspan x="669" dy="20">&quot;Asia/Ho_Chi_Minh&quot;) =&gt; today:</tspan><tspan x="669" dy="20">LocalDate</tspan></text><path d="M552,534h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="625" width="378" height="28" fill="white" stroke="none"/><text x="750" y="644" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: findAll()</tspan></text><path d="M552,665L948,665" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="730" width="378" height="28" fill="white" stroke="none"/><text x="750" y="749" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: streaks: List&lt;UserStreak&gt;</tspan></text><path d="M948,770L552,770" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="890" width="788" height="28" fill="white" stroke="none"/><text x="955" y="909" text-anchor="middle" font-size="15"><tspan x="955" dy="0">5: hasQualifyingCompletion(streak.studentId, today.minusDays(1))</tspan></text><path d="M552,930L1358,930" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="995" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1014" text-anchor="middle" font-size="15"><tspan x="955" dy="0">6: hasCompletion: boolean</tspan></text><path d="M1358,1035L552,1035" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1155" width="275" height="28" fill="white" stroke="none"/><text x="669" y="1174" text-anchor="start" font-size="15"><tspan x="669" dy="0">7: keepCurrentStreak(streak)</tspan></text><path d="M552,1169h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1371" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1390" text-anchor="middle" font-size="15"><tspan x="750" dy="0">8: resetCurrentStreak(streak.studentId, 0)</tspan></text><path d="M552,1411L948,1411" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1476" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1495" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: updatedStreak: UserStreak</tspan></text><path d="M948,1516L552,1516" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1637" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1656" text-anchor="start" font-size="15"><tspan x="669" dy="0">10: preserveStreakUnderBR74(</tspan><tspan x="669" dy="20">streak)</tspan></text><path d="M552,1671h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/></g></svg>