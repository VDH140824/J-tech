<svg xmlns="http://www.w3.org/2000/svg" width="2435" height="4002" viewBox="0 0 2435 4002"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,3947" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1190" width="2385" height="2707" fill="none" stroke="black"/><rect x="39" y="3351" width="2357" height="376" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">StudentGameHistoryPage</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">gameApi.ts</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«controller»</tspan><tspan x="1365" dy="20">:GameHistoryController</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="257.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«service»</tspan><tspan x="1775" dy="20">:GameHistoryService</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«repository»</tspan><tspan x="2185" dy="20">:GameSessionRepository</tspan></text><path d="M25,1685L2410,1685" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M39,3531L2396,3531" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="3446" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="2810" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="2580" fill="white" stroke="black"/><rect x="1769" y="887" width="12" height="2205" fill="white" stroke="black"/><rect x="30" y="10" width="2375" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-11.3 View game history</tspan></text><rect x="30" y="58" width="2375" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Source: UC-25 NF1–9, A1–A2; BR71, BR105</tspan></text><rect x="30" y="98" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Proposed function-level design derived from the SRS. Class, method, DTO and parameter names may change during implementation. Business behavior, data and branch conditions follow the cited UC / BR / NS requirements. UI messages are translated; SRS message IDs are retained.</tspan></text><rect x="30" y="130" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Preconditions: valid session, required role, active Student account; JWT authentication under Section 5.2.1. Read-only: viewing history neither changes results nor awards additional coins.</tspan></text><rect x="1371" y="759" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1020" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1190" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1210" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1192" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="1211" text-anchor="start" font-size="15"><tspan x="135" dy="0">[no completed game attempts exist — A1]</tspan></text><rect x="125" y="1690" width="2265" height="28" fill="white" stroke="none"/><text x="133" y="1709" text-anchor="start" font-size="15"><tspan x="133" dy="0">[completed game attempts exist]</tspan></text><rect x="1371" y="2585" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="2866" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3351" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3371" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="3353" width="2237" height="28" fill="white" stroke="none"/><text x="149" y="3372" text-anchor="start" font-size="15"><tspan x="149" dy="0">[incorrect answers exist]</tspan></text><rect x="139" y="3536" width="2237" height="28" fill="white" stroke="none"/><text x="147" y="3555" text-anchor="start" font-size="15"><tspan x="147" dy="0">[all answers are correct — A2]</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Open Games → Game History</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: listGameHistory(pageRequest)</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: listGameHistory(pageRequest,</tspan><tspan x="1160" dy="20">authentication)</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="690" width="275" height="88" fill="white" stroke="none"/><text x="1489" y="709" text-anchor="start" font-size="15"><tspan x="1489" dy="0">4:</tspan><tspan x="1489" dy="20">requireStudent(authentication)</tspan><tspan x="1489" dy="20">=&gt; studentId; validate</tspan><tspan x="1489" dy="20">protected access (§5.2.1)</tspan></text><path d="M1372,764h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="855" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="874" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">5: listGameHistory(studentId, pageRequest)</tspan></text><path d="M1372,895L1768,895" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="960" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="979" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: findCompletedByStudentId(studentId,</tspan><tspan x="1980" dy="20">pageRequest)</tspan></text><path d="M1782,1020L2178,1020" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1085" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1104" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: history: Page&lt;GameAttemptSummary&gt;</tspan></text><path d="M2178,1125L1782,1125" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1245" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1264" te