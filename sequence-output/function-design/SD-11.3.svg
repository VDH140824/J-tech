middle" font-size="15"><tspan x="1570" dy="0">20: getGameAttempt(studentId, attemptId)</tspan></text><path d="M1372,2721L1768,2721" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2786" width="378" height="68" fill="white" stroke="none"/><text x="1980" y="2805" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">21:</tspan><tspan x="1980" dy="20">findCompletedByIdAndStudentId(attemptId,</tspan><tspan x="1980" dy="20">studentId)</tspan></text><path d="M1782,2866L2178,2866" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2931" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2950" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">22: attempt: GameAttemptDetail</tspan></text><path d="M2178,2971L1782,2971" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3036" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3055" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">23: attempt: GameAttemptDetail</tspan></text><path d="M1768,3076L1372,3076" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3141" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3160" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">24: attempt: GameAttemptDetail</tspan></text><path d="M1358,3181L962,3181" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3246" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3265" text-anchor="middle" font-size="15"><tspan x="750" dy="0">25: attempt: GameAttemptDetail</tspan></text><path d="M948,3286L552,3286" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3406" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3425" text-anchor="middle" font-size="15"><tspan x="340" dy="0">26: Display the attempt&apos;s incorrectly</tspan