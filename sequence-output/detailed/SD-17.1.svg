1372,2415L1768,2415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2480" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2499" text-anchor="start" font-size="15"><tspan x="1899" dy="0">19: Chỉ tìm feedback học</tspan><tspan x="1899" dy="20">thuật; từ khóa theo title /</tspan><tspan x="1899" dy="20">Student name / content code</tspan></text><path d="M1782,2534h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2625" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2644" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">20: Truy vấn các ticket theo điều kiện đã</tspan><tspan x="1980" dy="20">chọn</tspan></text><path d="M1782,2685L2178,2685" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2750" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2769" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">21: Các ticket phù hợp</tspan></text><path d="M2178,2790L1782,2790" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="2910" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2929" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">22: Danh sách đã lọc</tspan></text><path d="M1768,2950L1372,2950" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3015" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3034" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">23: Danh sách đã lọc</tspan></text><path d="M1358,3055L962,3055" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3120" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3139" text-anchor="middle" font-size="15"><tspan x="750" dy="0">24: Danh sách đã lọc</tspan></text><path d="M948,3160L552,3160" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#o