<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="4176" viewBox="0 0 2845 4176"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4121" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1820" width="2795" height="2066" fill="none" stroke="black"/><rect x="39" y="2855" width="2767" height="986" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Nội dung phản hồi</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Tra cứu feedback học thuật</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">course / lesson</tspan></text><path d="M39,3330L2806,3330" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="4021" width="2745" height="50" fill="white" stroke="black"/><rect x="539" y="387" width="12" height="3585" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="3160" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="2930" fill="white" stroke="black"/><rect x="1769" y="722" width="12" height="2720" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.1 View content feedback list</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-48 NF1–7, A5a; BR113; §5.2.3</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: phiên Moderator có quyền hợp lệ. Chỉ đọc. Status filter theo UC-48: Chờ xử lý / Đang xử lý / Đã xử lý / Từ chối.</tspan></text><rect x="1781" y="844" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="1000" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1210" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1820" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1840" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="1822" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1841" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Moderator thay đổi điều kiện tra cứu]</tspan></text><rect x="551" y="2009" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2529" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="2685" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="2855" width="90" height="30" fill="white" stroke="black"/><text x="47" y="2875" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="2857" width="2647" height="28" fill="white" stroke="none"/><text x="149" y="2876" text-anchor="start" font-size="15"><tspan x="149" dy="0">[có kết quả]</tspan></text><rect x="139" y="3335" width="2647" height="28" fill="white" stroke="none"/><text x="147" y="3354" text-anchor="start" font-size="15"><tspan x="147" dy="0">[không có bản ghi phù hợp — A5a]</tspan></text><rect x="50" y="4021" width="75" height="28" fill="white" stroke="black"/><text x="58" y="4040" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="4025" width="2635" height="28" fill="white" stroke="none"/><text x="148" y="4044" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-17.2 — View content feedback detail</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Chọn “Nội dung phản hồi”</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Lấy danh sách feedback nội dung</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Chuyển yêu cầu kèm phiên xác thực hiện</tspan><tspan x="1160" dy="20">tại</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="690" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="709" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Lấy danh sách feedback nội dung</tspan></text><path d="M1372,730L1768,730" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="795" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="814" text-anchor="start" font-size="15"><tspan x="1899" dy="0">5: Giới hạn academic content:</tspan><tspan x="1899" dy="20">lecture / question /</tspan><tspan x="1899" dy="20">pedagogical material</tspan></text><path d="M1782,849h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="940" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="959" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Lấy tất cả ticket nội dung; ưu tiên Chờ</tspan><tspan x="1980" dy="20">xử lý; mới nhất trước</tspan></text><path d="M1782,1000L2178,1000" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1065" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1084" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: Danh sách content feedback</tspan></text><path d="M2178,1105L1782,1105" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1170" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1189" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: Lấy ngữ cảnh khóa học / bài học cho danh sách và bộ lọc</tspan></text><path d="M1782,1210L2588,1210" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1275" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1294" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">9: Course / Lesson liên quan</tspan></text><path d="M2588,1315L1782,1315" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1380" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1399" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Danh sách content feedback và bộ lọc</tspan></text><path d="M1768,1420L1372,1420" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1485" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1504" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: Danh sách content feedback và bộ lọc</tspan></text><path d="M1358,1525L962,1525" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1590" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1609" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Danh sách content feedback và bộ lọc</tspan></text><path d="M948,1630L552,1630" fill="none" stroke=