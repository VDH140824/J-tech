<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2677" viewBox="0 0 1615 2677"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,2622" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,2622" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,2622" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,2622" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="705" width="1565" height="1867" fill="none" stroke="black"/><rect x="39" y="990" width="1537" height="1537" fill="none" stroke="black"/><rect x="53" y="1686" width="1509" height="796" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Hoạt động đủ điều kiện thưởng</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«control»</tspan><tspan x="545" dy="20">Coin_EXP_Transaction_Ledger</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«entity»</tspan><tspan x="955" dy="20">coin_transaction</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«entity»</tspan><tspan x="1365" dy="20">user / số dư coin</tspan></text><rect x="50" y="480" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="510" text-anchor="start" font-size="15"><tspan x="58" dy="0">Điều kiện và coin được xác định theo cấu hình ở luồng gọi. BR40: lần hoàn thành thành công đầu tiên; BR45: mốc streak một lần mỗi chuỗi liên tục.</tspan></text><path d="M39,1275L1576,1275" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,2056L1562,2056" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="2011" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-13.2 Award coins with idempotent ledger</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: NS-08 Coin_EXP_Transaction_Ledger; BR40, BR45, BR68–69; §4 Data Integrity</tspan></text><rect x="30" y="98" width="1555" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="1555" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR45 là nguồn cho thưởng mốc streak; NS-08 mô tả exercise / game. Không đặt thuật toán khóa, mức EXP, SQL, endpoint hoặc số coin không có trong SRS.</tspan></text><rect x="551" y="609" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="705" width="90" height="30" fill="white" stroke="black"/><text x="33" y="725" text-anchor="start" font-size="15"><tspan x="33" dy="0">critical</tspan></text><rect x="127" y="707" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="726" text-anchor="start" font-size="15"><tspan x="135" dy="0">[giao dịch ACID; idempotency bảo vệ cấp thưởng — NS-08 / §4]</tspan></text><rect x="949" y="820" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="990" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1010" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="992" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="1011" text-anchor="start" font-size="15"><tspan x="149" dy="0">[khóa thưởng đã tồn tại]</tspan></text><rect x="551" y="1074" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1280" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1299" text-anchor="start" font-size="15"><tspan x="147" dy="0">[khóa thưởng chưa tồn tại]</tspan></text><rect x="1359" y="1371" width="12" height="105" fill="white" stroke="black"/><rect x="53" y="1686" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1706" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1688" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1707" text-anchor="start" font-size="15"><tspan x="163" dy="0">[toàn bộ cập nhật thành công]</tspan></text><rect x="949" y="1621" width="12" height="160" fill="white" stroke="black"/><rect x="551" y="1855" width="12" height="45" fill="white" stroke="black"/><rect x="153" y="2061" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="2080" text-anchor="start" font-size="15"><tspan x="161" dy="0">[giao dịch không hoàn tất]</tspan></text><rect x="551" y="2246" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Yêu cầu cấp thưởng khi hoàn thành</tspan><tspan x="340" dy="20">exercise / game — NS-08</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="560" width="275" height="68" fill="white" stroke="none"/><text x="669" y="579" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: Dùng idempotency award key</tspan><tspan x="669" dy="20">gắn với phần thưởng — không tự</tspan><tspan x="669" dy="20">định dạng khóa</tspan></text><path d="M552,614h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="760" width="378" height="48" fill="white" stroke="none"/><text x="750" y="779" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: Kiểm tra khóa thưởng đã được ghi trong</tspan><tspan x="750" dy="20">ledger</tspan></text><path d="M552,820L948,820" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="885" width="378" height="28" fill="white" stroke="none"/><text x="750" y="904" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: Khóa đã tồn tại / chưa tồn tại</tspan></text><path d="M948,925L552,925" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1045" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1064" text-anchor="start" font-size="15"><tspan x="669" dy="0">5: Không tạo thêm phân bổ coin</tspan><tspan x="669" dy="20">/ EXP hoặc ledger entry</tspan></text><path d="M552,1079h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1170" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1189" text-anchor="middle" font-size="15"><tspan x="340" dy="0">6: Không thưởng trùng cho cùng khóa</tspan></text><path d="M538,1210L142,1210" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1331" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1350" text-anchor="middle" font-size="15"><tspan x="955" dy="0">7: Cộng EXP vào hồ sơ và coin vào số dư trong giao dịch</tspan></text><path d="M552,1371L1358,1371" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1436" width="788" height="28" fill="white" stroke="none"/><text x="955" y="1455" text-anchor="middle" font-size="15"><tspan x="955" dy="0">8: Kết quả cập nhật hồ sơ / số dư</tspan></text><path d="M1358,1476L552,1476" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1541" width="378" height="68" fill="white" stroke="none"/><text x="750" y="1560" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: Ghi entry bất biến: EARN, amount,</tspan><tspan x="750" dy="20">balance sau giao dịch, source activity,</tspan><tspan x="750" dy="20">idempotency key</tspan></text><path d="M552,1621L948,1621" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1741" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1760" text-anchor="middle" font-size="15"><tspan x="750" dy="0">10: Ledger entry đã ghi</tspan></text><path d="M948,1781L552,1781" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1846" width="275" height="28" fill="white" stroke="none"/><text x="669" y="1865" text-anchor="start" font-size="15"><tspan x="669" dy="0">11: Commit giao dịch ACID</tspan></text><path d="M552,1860h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="1951" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1970" text-anchor="middle" font-size="15"><tspan x="340" dy="0">12: Kết quả cấp thưởng đã commit</tspan></text><path d="M538,1991L142,1991" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2112" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2131" text-anchor="middle" font-size="15"><tspan x="750" dy="0">13: Giao dịch thất bại</tspan></text><path d="M948,2152L552,2152" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="2217" width="275" height="48" fill="white" stroke="none"/><text x="669" y="2236" text-anchor="start" font-size="15"><tspan x="669" dy="0">14: Rollback các thay đổi;</tspan><tspan x="669" dy="20">không cấp coin / EXP một phần</tspan></text><path d="M552,2251h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="2342" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2361" text-anchor="middle" font-size="15"><tspan x="340" dy="0">15: Cấp thưởng thất bại; bảo toàn dữ liệu</tspan><tspan x="340" dy="20">trước giao dịch</tspan></text><path d="M538,2402L142,2402" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>