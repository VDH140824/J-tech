<svg xmlns="http://www.w3.org/2000/svg" width="2845" height="2571" viewBox="0 0 2845 2571"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,2516" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1340" width="2795" height="1126" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Chuỗi đăng nhập</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Tra cứu thông tin streak</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">User_Streak</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">Cấu hình mốc thưởng</tspan></text><path d="M25,1895L2820,1895" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="387" width="12" height="2015" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="1785" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="1535" fill="white" stroke="black"/><rect x="1769" y="722" width="12" height="1305" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.2 View login streak</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-27 NF1–6, A1; BR108–109; §5.2.5</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: phiên hợp lệ, đúng vai trò; Student Active. §5.2.1 quy định JWT cho các yêu cầu được bảo vệ. BR109: chỉ đọc, không cập nhật streak hay cấp coin. UC-27 gọi “login streak”; BR108 gọi “learning streak”.</tspan></text><rect x="2179" y="835" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1045" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="1244" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1340" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1360" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1342" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1361" text-anchor="start" font-size="15"><tspan x="135" dy="0">[có mốc thưởng tiếp theo]</tspan></text><rect x="125" y="1900" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="1919" text-anchor="start" font-size="15"><tspan x="133" dy="0">[không có mốc tiếp theo — A1]</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Chọn “Chuỗi đăng nhập”</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Lấy thông tin streak của Student</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Chuyển yêu cầu kèm phiên xác thực hiện</tspan><tspan x="1160" dy="20">tại</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="690" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="709" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Lấy thông tin streak của Student</tspan></text><path d="M1372,730L1768,730" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="795" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="814" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">5: Lấy streak hiện tại và longest streak</tspan></text><path d="M1782,835L2178,835" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="900" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="919" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">6: Current streak; longest streak</tspan></text><path d="M2178,940L1782,940" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="1005" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1024" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">7: Lấy các mốc thưởng streak được cấu hình</tspan></text><path d="M1782,1045L2588,1045" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1110" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="1129" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">8: Số ngày mục tiêu và coin cho mỗi mốc</tspan></text><path d="M2588,1150L1782,1150" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="1215" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="1234" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Xác định mốc thưởng tiếp</tspan><tspan x="1899" dy="20">theo theo current streak</tspan></text><path d="M1782,1249h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1395" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1414" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Current streak, longest streak, next</tspan><tspan x="1570" dy="20">milestone, configured coins</tspan></text><path d="M1768,1455L1372,1455" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1520" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1539" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">11: Current streak, longest streak, next</tspan><tspan x="1160" dy="20">milestone, configured coins</tspan></text><path d="M1358,1580L962,1580" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1645" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1664" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Current streak, longest streak, next</tspan><tspan x="750" dy="20">milestone, configured coins</tspan></text><path d="M948,1705L552,1705" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1770" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1789" text-anchor="middle" font-size="15"><tspan x="340" dy="0">13: Hiển thị streak hiện tại, dài nhất,</tspan><tspan x="340" dy="20">mốc tiếp theo và số coin</tspan></text><path d="M538,1830L142,1830" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1951" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1970" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">14: Current / longest streak; không có</tspan><tspan x="1570" dy="20">next milestone</tspan></text><path d="M1768,2011L1372,2011" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2076" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="2095" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">15: Current / longest streak; không có</tspan><tspan x="1160" dy="20">next milestone</tspan></text><path d="M1358,2136L962,2136" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2201" width="378" height="48" fill="white" stroke="none"/><text x="750" y="2220" text-anchor="middle" font-size="15"><tspan x="750" dy="0">16: Current / longest streak; không có</tspan><tspan x="750" dy="20">next milestone</tspan></text><path d="M948,2261L552,2261" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2326" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2345" text-anchor="middle" font-size="15"><tspan x="340" dy="0">17: Hiển thị streak hiện tại, dài nhất;</tspan><tspan x="340" dy="20">thông báo không có mốc tiếp theo</tspan></text><path d="M538,2386L142,2386" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>