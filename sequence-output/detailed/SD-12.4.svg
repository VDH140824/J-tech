<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="2032" viewBox="0 0 1615 2032"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,1977" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="815" width="1565" height="1112" fill="none" stroke="black"/><rect x="39" y="1080" width="1537" height="802" fill="none" stroke="black"/><rect x="53" y="1296" width="1509" height="541" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Scheduler</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="257.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«control»</tspan><tspan x="545" dy="20">Daily_Streak_Reset_Job</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="257.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«entity»</tspan><tspan x="955" dy="20">User_Streak</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="257.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«entity»</tspan><tspan x="1365" dy="20">Ngày học đã ghi nhận</tspan></text><path d="M39,1240L1576,1240" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,1561L1562,1561" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="1742" width="1515" height="50" fill="white" stroke="none"/><text x="58" y="1772" text-anchor="start" font-size="15"><tspan x="58" dy="0">BR74 dẫn BR146 nhưng SRS không có BR146. Không vẽ cách kích hoạt, thời hạn hoặc tiêu hao freeze.</tspan></text><rect x="539" y="407" width="12" height="1286" fill="white" stroke="black"/><rect x="30" y="10" width="1555" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.4 Daily streak reset job</tspan></text><rect x="30" y="58" width="1555" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: NS-02 Daily_Streak_Reset_Job; BR43, BR74, BR112; §5.2.5</tspan></text><rect x="30" y="98" width="1555" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="1555" height="46" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mâu thuẫn cần chốt: NS-02 chấp nhận qualifying login hoặc học và nêu CurrentDate − LastLearningDate &gt; 1; BR112 không tính login. Phần quyết định đủ điều kiện ở sơ đồ theo BR74 / BR112; lịch</tspan><tspan x="38" dy="19">chạy theo NS-02.</tspan></text><rect x="551" y="509" width="12" height="45" fill="white" stroke="black"/><rect x="949" y="645" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="815" width="90" height="30" fill="white" stroke="black"/><text x="33" y="835" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="817" width="1445" height="28" fill="white" stroke="none"/><text x="135" y="836" text-anchor="start" font-size="15"><tspan x="135" dy="0">[mỗi Student trong User_Streak]</tspan></text><rect x="1359" y="910" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="1080" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1100" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1082" width="1417" height="28" fill="white" stroke="none"/><text x="149" y="1101" text-anchor="start" font-size="15"><tspan x="149" dy="0">[có hoàn thành đủ điều kiện ngày trước — BR112]</tspan></text><rect x="551" y="1144" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="1245" width="1417" height="28" fill="white" stroke="none"/><text x="147" y="1264" text-anchor="start" font-size="15"><tspan x="147" dy="0">[không có hoàn thành đủ điều kiện ngày trước — BR74]</tspan></text><rect x="53" y="1296" width="90" height="30" fill="white" stroke="black"/><text x="61" y="1316" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="1298" width="1389" height="28" fill="white" stroke="none"/><text x="163" y="1317" text-anchor="start" font-size="15"><tspan x="163" dy="0">[không được streak-freeze bảo toàn]</tspan></text><rect x="949" y="1391" width="12" height="105" fill="white" stroke="black"/><rect x="153" y="1566" width="1389" height="28" fill="white" stroke="none"/><text x="161" y="1585" text-anchor="start" font-size="15"><tspan x="161" dy="0">[được bảo toàn bởi streak-freeze theo ngoại lệ BR74]</tspan></text><rect x="551" y="1646" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Kích hoạt hằng ngày lúc 00:00:01 GMT+7</tspan><tspan x="340" dy="20">— NS-02</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="480" width="275" height="48" fill="white" stroke="none"/><text x="669" y="499" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: Dùng ngày lịch</tspan><tspan x="669" dy="20">Asia/Ho_Chi_Minh — BR74</tspan></text><path d="M552,514h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="605" width="378" height="28" fill="white" stroke="none"/><text x="750" y="624" text-anchor="middle" font-size="15"><tspan x="750" dy="0">3: Quét các bản ghi User_Streak</tspan></text><path d="M552,645L948,645" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="710" width="378" height="28" fill="white" stroke="none"/><text x="750" y="729" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: Các bản ghi streak</tspan></text><path d="M948,750L552,750" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="870" width="788" height="28" fill="white" stroke="none"/><text x="955" y="889" text-anchor="middle" font-size="15"><tspan x="955" dy="0">5: Kiểm tra ngày lịch trước đó có hoàn thành học đủ điều kiện</tspan></text><path d="M552,910L1358,910" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="975" width="788" height="28" fill="white" stroke="none"/><text x="955" y="994" text-anchor="middle" font-size="15"><tspan x="955" dy="0">6: Thông tin hoạt động ngày trước</tspan></text><path d="M1358,1015L552,1015" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1135" width="275" height="28" fill="white" stroke="none"/><text x="669" y="1154" text-anchor="start" font-size="15"><tspan x="669" dy="0">7: Giữ streak; không reset</tspan></text><path d="M552,1149h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1351" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1370" text-anchor="middle" font-size="15"><tspan x="750" dy="0">8: Đặt current_streak = 0</tspan></text><path d="M552,1391L948,1391" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1456" width="378" height="28" fill="white" stroke="none"/><text x="750" y="1475" text-anchor="middle" font-size="15"><tspan x="750" dy="0">9: Streak đã reset</tspan></text><path d="M948,1496L552,1496" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="1617" width="275" height="48" fill="white" stroke="none"/><text x="669" y="1636" text-anchor="start" font-size="15"><tspan x="669" dy="0">10: Không reset theo ngoại lệ</tspan><tspan x="669" dy="20">được BR74 nêu</tspan></text><path d="M552,1651h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/></g></svg>