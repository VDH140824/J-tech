<svg xmlns="http://www.w3.org/2000/svg" width="2435" height="3771" viewBox="0 0 2435 3771"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,3716" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="1630" width="2385" height="320" fill="none" stroke="black"/><rect x="25" y="1980" width="2385" height="1481" fill="none" stroke="black"/><rect x="39" y="3080" width="2357" height="336" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Administrator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Phản hồi &amp; Báo lỗi hệ thống</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Tra cứu ticket kỹ thuật</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><path d="M39,3240L2396,3240" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="3616" width="2335" height="50" fill="white" stroke="black"/><rect x="539" y="387" width="12" height="3180" fill="white" stroke="black"/><rect x="949" y="492" width="12" height="2539" fill="white" stroke="black"/><rect x="1359" y="617" width="12" height="2309" fill="white" stroke="black"/><rect x="1769" y="722" width="12" height="2099" fill="white" stroke="black"/><rect x="30" y="10" width="2375" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.4 View technical feedback list</tspan></text><rect x="30" y="58" width="2375" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-63 NF1–4, A2a; §5.2.3</tspan></text><rect x="30" y="98" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="2375" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: Administrator đã đăng nhập. UC-63 ghi trạng thái “Đã giải quyết”; UC-64 dùng “Đã xử lý”. UC-63 dẫn UC-75 nhưng chức năng tương ứng là UC-64.</tspan></text><rect x="1781" y="844" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="980" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="1630" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1650" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="1632" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="1651" text-anchor="start" font-size="15"><tspan x="135" dy="0">[không có phản ánh kỹ thuật chưa xử lý — A2a]</tspan></text><rect x="551" y="1714" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1980" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2000" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="1982" width="2265" height="28" fill="white" stroke="none"/><text x="135" y="2001" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Admin tra cứu / thay đổi bộ lọc]</tspan></text><rect x="2179" y="2595" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="3080" width="90" height="30" fill="white" stroke="black"/><text x="47" y="3100" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="3082" width="2237" height="28" fill="white" stroke="none"/><text x="149" y="3101" text-anchor="start" font-size="15"><tspan x="149" dy="0">[có bản ghi khớp]</tspan></text><rect x="139" y="3245" width="2237" height="28" fill="white" stroke="none"/><text x="147" y="3264" text-anchor="start" font-size="15"><tspan x="147" dy="0">[không có bản ghi khớp — §5.2.3]</tspan></text><rect x="50" y="3616" width="75" height="28" fill="white" stroke="black"/><text x="58" y="3635" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="3620" width="2225" height="28" fill="white" stroke="none"/><text x="148" y="3639" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-17.5 — Resolve technical feedback</tspan></text><rect x="151" y="355" width="378" height="28" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Mở “Phản hồi &amp; Báo lỗi hệ thống”</tspan></text><path d="M142,395L538,395" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="460" width="378" height="28" fill="white" stroke="none"/><text x="750" y="479" text-anchor="middle" font-size="15"><tspan x="750" dy="0">2: Lấy danh sách technical feedback</tspan></text><path d="M552,500L948,500" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="565" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="584" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">3: Chuyển yêu cầu kèm phiên xác thực hiện</tspan><tspan x="1160" dy="20">tại</tspan></text><path d="M962,625L1358,625" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="690" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="709" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">4: Lấy danh sách technical feedback</tspan></text><path d="M1372,730L1768,730" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="795" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="814" text-anchor="start" font-size="15"><tspan x="1899" dy="0">5: Chỉ lấy lỗi kỹ thuật / UI /</tspan><tspan x="1899" dy="20">nền tảng; content feedback</tspan><tspan x="1899" dy="20">thuộc Moderator</tspan></text><path d="M1782,849h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="940" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="959" text-anchor="middle" font-size="15"><ts