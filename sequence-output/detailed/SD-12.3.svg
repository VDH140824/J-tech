start" font-size="15"><tspan x="1899" dy="0">21: Không tăng streak lần nữa;</tspan><tspan x="1899" dy="20">hoạt động ôn tập vẫn là ngày</tspan><tspan x="1899" dy="20">học đủ điều kiện</tspan></text><path d="M1782,3376h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="3512" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="3531" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">22: Kết quả ghi nhận hoạt động và learning</tspan><tspan x="1570" dy="20">streak</tspan></text><path d="M1768,3572L1372,3572" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3637" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="3656" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">23: Kết quả ghi nhận hoạt động và learning</tspan><tspan x="1160" dy="20">streak</tspan></text><path d="M1358,3697L962,3697" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3762" width="378" height="48" fill="white" stroke="none"/><text x="750" y="3781" text-anchor="middle" font-size="15"><tspan x="750" dy="0">24: Kết quả ghi nhận hoạt động và learning</tspan><tspan x="750" dy="20">streak</tspan></text><path d="M948,3822L552,3822" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="3887" width="378" height="28" fill="white" stroke="none"/><text x="340" y="3906" text-anchor="middle" font-size="15"><tspan x="340" dy="0">25: Hoạt động hoàn thành đã được ghi nhận</tspan></text><path d="M538,3927L142,3927" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>