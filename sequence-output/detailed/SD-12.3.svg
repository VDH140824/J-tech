</tspan><tspan x="545" dy="20">Hoạt động học / luyện tập</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Ghi nhận học tập và streak</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="247.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">learning_item_progress /</tspan><tspan x="2185" dy="20">lesson_section_progress</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">practice_attempt</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">study_session / User_Streak</tspan></text><rect x="3255" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3415" y="257.5" text-anchor="middle" font-size="15"><tspan x="3415" dy="0">«entity»</tspan><tspan x="3415" dy="20">Cấu hình mốc thưởng / coin ledger</tspan></text><path d="M39,1530L3626,1530" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="50" y="3141" width="3565" height="50" fill="white" stroke="black"/><path d="M25,3266L3640,3266" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3536" fill="white" stroke="black"/><rect x="949" y="532" width="12" height="3306" fill="white" stroke="black"/><rect x="1359" y="657" width="12" height="3056" fill="white" stroke="black"/><rect x="1769" y="782" width="12" height="2806" fill="white" stroke="black"/><rect x="30" y="10" width="3605" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.3 Record activity &amp; update learning streak</tspan></text><rect x="30" y="58" width="3605" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-26 NF1–5; BR43, BR45, BR106–107, BR112; §3.1.5; §5.2.5</tspan></text><rect x="30" y="98" width="3605" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="3605" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">BR112: đăng nhập / chỉ mở bài không đủ điều kiện. NS-02 nhắc qualifying login, khác BR112; sơ đồ này thể hiện quy tắc học tại BR112. Không suy ra công thức khởi tạo streak hoặc cách dùng freeze chưa được SRS quy định.</tspan></text><rect x="1781" y="884" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="980" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1000" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="982" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="1001" text-anchor="start" font-size="15"><tspan x="135" dy="0">[có nội dung học được hoàn thành — UC-26 NF1–2]</tspan></text><rect x="2179" y="1095" width="12" height="105" fill="white" stroke="black"/><rect x="39" y="1265" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1285" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="1267" width="3467" height="28" fill="white" stroke="none"/><text x="149" y="1286" text-anchor="start" font-size="15"><tspan x="149" dy="0">[nội dung / kiến thức được hoàn thành lần đầu]</tspan></text><rect x="2179" y="1360" width="12" height="105" fill="white" stroke="black"/><rect x="139" y="1535" width="3467" height="28" fill="white" stroke="none"/><text x="147" y="1554" text-anchor="start" font-size="15"><tspan x="147" dy="0">[đã hoàn thành trước đây — BR106]</tspan></text><rect x="1781" y="1615" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1801" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1821" text-anchor="start" font-size="15"><tspan x="33" dy="0">opt</tspan></text><rect x="127" y="1803" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="1822" text-anchor="start" font-size="15"><tspan x="135" dy="0">[hoàn thành một practice attempt — NF3–4 / BR107]</tspan></text><rect x="2589" y="1896" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="2115" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="2296" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="2466" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2486" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2468" width="3495" height="28" fill="white" stroke="none"/><text x="135" y="2487" text-anchor="start" font-size="15"><tspan x="135" dy="0">[ngày hiện tại chưa được tính vào learning streak]</tspan></text><rect x="1781" y="2570" width="12" h