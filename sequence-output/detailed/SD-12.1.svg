<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4857" viewBox="0 0 3255 4857"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4802" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="685" width="3205" height="4067" fill="none" stroke="black"/><rect x="39" y="1305" width="3177" height="675" fill="none" stroke="black"/><rect x="39" y="2115" width="3177" height="2592" fill="none" stroke="black"/><rect x="53" y="2936" width="3149" height="416" fill="none" stroke="black"/><rect x="53" y="3947" width="3149" height="215" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Tiến độ học tập</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Tổng hợp thống kê học tập</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="247.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">lesson_section_progress /</tspan><tspan x="2185" dy="20">learning_item_progress</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="247.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">practice_attempt / reading_session</tspan><tspan x="2595" dy="20">/ speaking_session</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">study_session / User_Streak</tspan></text><rect x="50" y="355" width="3155" height="50" fill="white" stroke="none"/><text x="58" y="385" text-anchor="start" font-size="15"><tspan x="58" dy="0">Nguồn dữ liệu theo NF1–5: hoàn thành đầu tiên, kiến thức mới không trùng, từng practice attempt và ngày có học thực tế. Ghi nhận hoạt động được chi tiết ở SD-12.3.</tspan></text><path d="M39,2735L3216,2735" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M53,3156L3202,3156" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="467" width="12" height="4176" fill="white" stroke="black"/><rect x="949" y="877" width="12" height="3641" fill="white" stroke="black"/><rect x="1359" y="1002" width="12" height="3391" fill="white" stroke="black"/><rect x="1769" y="1107" width="12" height="3161" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-12.1 View learning progress</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-26 NF1–13, A1–A3, E1; BR106–107, BR110, BR114, BR117–118</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: phiên hợp lệ, đúng vai trò; Student Active. §5.2.1 quy định JWT cho các yêu cầu được bảo vệ. Xem tiến độ không sửa dữ liệu hoàn thành hoặc kết quả luyện tập.</tspan></text><rect x="551" y="589" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="685" width="90" height="30" fill="white" stroke="black"/><text x="33" y="705" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="687" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="706" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Student chọn / đổi phạm vi thống kê — NF8–13]</tspan></text><rect x="39" y="1305" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1325" text-anchor="start" font-size="15"><tspan x="47" dy="0">break</tspan></text><rect x="141" y="1307" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="1326" text-anchor="start" font-size="15"><tspan x="149" dy="0">[không tải được bản ghi — E1 / BR118]</tspan></text><rect x="2179" y="1240" width="12" height="160" fill="white" stroke="black"/><rect x="39" y="2115" width="90" height="30" fill="white" stroke="black"/><text x="47" y="2135" text-anchor="start" font-size="15"><tspan x="47" dy="0">alt</tspan></text><rect x="141" y="2117" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="2136" text-anchor="start" font-size="15"><tspan x="149" dy="0">[không có bản ghi phù hợp — A1]</tspan></text><rect x="1781" y="2199" width="12" height="45" fill="white" stroke="black"/><rect x="139" y="2740" width="3057" height="28" fill="white" stroke="none"/><text x="147" y="2759" text-anchor="start" font-size="15"><tspan x="147" dy="0">[có dữ liệu]</tspan></text><rect x="1781" y="2840" width="12" height="45" fill="white" stroke="black"/><rect x="53" y="2936" width="90" height="30" fill="white" stroke="black"/><text x="61" y="2956" text-anchor="start" font-size="15"><tspan x="61" dy="0">alt</tspan></text><rect x="155" y="2938" width="3029" height="28" fill="white" stroke="none"/><text x="163" y="2957" text-anchor="start" font-size="15"><tspan x="163" dy="0">[có hoạt động bắt buộc trong phạm vi]</tspan></text><rect x="1781" y="3060" width="12" height="45" fill="white" stroke="black"/><rect x="153" y="3161" width="3029" height="28" fill="white" stroke="none"/><text x="161" y="3180" text-anchor="start" font-size="15"><tspan x="161" dy="0">[không có hoạt động bắt buộc — A2]</tspan></text><rect x="1781" y="3241" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3422" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="3641" width="12" height="45" fill="white" stroke="black"/><rect x="2999" y="3777" width="12" height="105" fill="white" stroke="black"/><rect x="53" y="3947" width="90" height="30" fill="white" stroke="black"/><text x="61" y="3967" text-anchor="start" font-size="15"><tspan x="61" dy="0">opt</tspan></text><rect x="155" y="3949" width="3029" height="28" fill="white" stroke="none"/><text x="163" y="3968" text-anchor="start" font-size="15"><tspan x="163" dy="0">[có triển khai theo dõi active study time — A3 / BR114]</tspan></text><rect x="1781" y="4051" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="435" width="378" height="28" fill="white" stroke="none"/><text x="340" y="454" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Chọn “Tiến độ học tập”</tspan></text><path d="M142,475L538,475" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="540" width="275" height="68" fill="white" stroke="none"/><text x="669" y="559" text-anchor="start" font-size="15"><tspan x="669" dy="0">2: Hiển thị bộ lọc Tuần /</tspan><tspan x="669" dy="20">Tháng / Toàn bộ, khóa học,</tspan><tspan x="669" dy="20">chương</tspan></text><path d="M552,594h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="740" width="378" height="28" fill="white" stroke="none"/><text x="340" y="759" text-anchor="middle" font-size="15"><tspan x="340" dy="0">3: Chọn thời gian, khóa học và chương</tspan></text><path d="M142,780L538,780" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="845" width="378" height="28" fill="white" stroke="none"/><text x="750" y="864" text-anchor="middle" font-size="15"><tspan x="750" dy="0">4: Truy xuất thống kê theo bộ lọc đã chọn</tspan></text><path d="M552,885L948,885" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="950" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="969" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">5: Chuyển yêu cầu kèm phiên xác thực hiện</tspan><tspan x="1160" dy="20">tại</tspan></text><path d="M962,1010L1358,1010" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1075" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1094" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">6: Truy xuất thống kê theo bộ lọc đã chọn</tspan></text><path d="M1372,1115L1768,1115" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1180" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="1199" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">7: Lấy bản ghi hoàn thành, kiến thức mới</tspan><tspan x="1980" dy="20">và hoạt động bắt buộc trong phạm vi</tspan></text><path d="M1782,1240L2178,1240" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="1360" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="1379" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">8: Lỗi truy xuất</tspan></text><path d="M2178,1400L1782,1400" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="1465" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="1484" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">9: Tải dữ liệu thất bại; không hiển thị dữ</tspan><tspan x="1570" dy="20">liệu thiếu thành 0%</tspan></text><path d="M1768,1525L1372,1525" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="1590" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="1609" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">10: Tải dữ liệu thất bại; không hiển thị</tspan><tspan x="1160" dy="20">dữ liệu thiếu thành 0%</tspan></text><path d="M1358,1650L962,1650" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1715" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1734" text-anchor="middle" font-size="15"><tspan x="750" dy="0">11: Tải dữ liệu thất bại; không hiển thị</tspan><tspan x="750" dy="20">dữ liệu thiếu thành 0%</tspan></text><path d="M948,1775L552,1775" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1840" width="378" height="48" fill="white" stroke="none"/><text x="340" y="1859" text-anchor="middle" font-size="15"><tspan x="340" dy="0">12: Tải dữ liệu thất bại; không hiển thị</tspan><tspan x="340" dy="20">dữ liệu thiếu thành 0%</tspan></text><path d="M538,1900L142,1900" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1791" y="2010" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2029" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">13: Các bản ghi phù hợp với bộ lọc</tspan></text><path d="M2178,2050L1782,2050" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2170" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="2189" text-anchor="start" font-size="15"><tspan x="1899" dy="0">14: Số hoạt động = 0; kết quả</tspan><tspan x="1899" dy="20">luyện tập = unavailable</tspan></text><path d="M1782,2204h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2295" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2314" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">15: Trạng thái không có dữ liệu</tspan></text><path d="M1768,2335L1372,2335" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="2400" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="2419" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">16: Trạng thái không có dữ liệu</tspan></text><path d="M1358,2440L962,2440" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="2505" width="378" height="28" fill="white" stroke="none"/><text x="750" y="2524" text-anchor="middle" font-size="15"><tspan x="750" dy="0">17: Trạng thái không có dữ liệu</tspan></text><path d="M948,2545L552,2545" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="2610" width="378" height="48" fill="white" stroke="none"/><text x="340" y="2629" text-anchor="middle" font-size="15"><tspan x="340" dy="0">18: Hiển thị no-data rõ ràng; không giả</tspan><tspan x="340" dy="20">lập điểm số 0</tspan></text><path d="M538,2670L142,2670" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2791" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="2810" text-anchor="start" font-size="15"><tspan x="1899" dy="0">19: Đếm Vocabulary / Kanji /</tspan><tspan x="1899" dy="20">Grammar mới; không đếm lại</tspan><tspan x="1899" dy="20">kiến thức đã học</tspan></text><path d="M1782,2845h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2991" width="275" height="88" fill="white" stroke="none"/><text x="1899" y="3010" text-anchor="start" font-size="15"><tspan x="1899" dy="0">20: Completion % = completed</tspan><tspan x="1899" dy="20">required activities / total</tspan><tspan x="1899" dy="20">required activities × 100 —</tspan><tspan x="1899" dy="20">BR110</tspan></text><path d="M1782,3065h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="3212" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="3231" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21: Completion percentage =</tspan><tspan x="1899" dy="20">unavailable</tspan></text><path d="M1782,3246h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3382" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3401" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">22: Lấy từng practice attempt và số hoạt động nghe / đọc / hội thoại hoàn thành</tspan></text><path d="M1782,3422L2588,3422" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3487" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3506" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">23: Activity, completion time, score hoặc correct count / total</tspan></text><path d="M2588,3527L1782,3527" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="3592" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="3611" text-anchor="start" font-size="15"><tspan x="1899" dy="0">24: Tính số lượt; xác định kết</tspan><tspan x="1899" dy="20">quả đầu tiên / mới nhất / cao</tspan><tspan x="1899" dy="20">nhất — BR107</tspan></text><path d="M1782,3646h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3737" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="3756" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">25: Lấy ngày học thực tế, learning-day streak và thói quen trong phạm vi</tspan></text><path d="M1782,3777L2998,3777" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3842" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="3861" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">26: Thống kê ngày học và chuỗi ngày học</tspan></text><path d="M2998,3882L1782,3882" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="4002" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="4021" text-anchor="start" font-size="15"><tspan x="1899" dy="0">27: Dùng thời gian học thực</tspan><tspan x="1899" dy="20">tế; không dùng thời lượng đăng</tspan><tspan x="1899" dy="20">nhập</tspan></text><path d="M1782,4056h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="4192" width="378" height="48" fill="white" stroke="none"/><text x="1570" y="4211" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">28: Thống kê hoàn thành, kiến thức mới,</tspan><tspan x="1570" dy="20">lượt luyện tập, kỹ năng và thói quen</tspan></text><path d="M1768,4252L1372,4252" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="4317" width="378" height="48" fill="white" stroke="none"/><text x="1160" y="4336" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">29: Thống kê hoàn thành, kiến thức mới,</tspan><tspan x="1160" dy="20">lượt luyện tập, kỹ năng và thói quen</tspan></text><path d="M1358,4377L962,4377" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="4442" width="378" height="48" fill="white" stroke="none"/><text x="750" y="4461" text-anchor="middle" font-size="15"><tspan x="750" dy="0">30: Thống kê hoàn thành, kiến thức mới,</tspan><tspan x="750" dy="20">lượt luyện tập, kỹ năng và thói quen</tspan></text><path d="M948,4502L552,4502" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="4567" width="378" height="48" fill="white" stroke="none"/><text x="340" y="4586" text-anchor="middle" font-size="15"><tspan x="340" dy="0">31: Hiển thị kết quả đúng bộ lọc và</tspan><tspan x="340" dy="20">learning-day streak</tspan></text><path d="M538,4627L142,4627" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>