0" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Tra cứu và đối chiếu nội dung</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="247.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">course / chapter / lesson /</tspan><tspan x="2595" dy="20">question</tspan></text><path d="M25,2100L2820,2100" fill="none" stroke="black" stroke-dasharray="7 6" /><path d="M25,3946L2820,3946" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3986" fill="white" stroke="black"/><rect x="949" y="512" width="12" height="3756" fill="white" stroke="black"/><rect x="1359" y="637" width="12" height="3526" fill="white" stroke="black"/><rect x="1769" y="742" width="12" height="3316" fill="white" stroke="black"/><rect x="30" y="10" width="2785" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.2 View content feedback detail</tspan></text><rect x="30" y="58" width="2785" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-49 NF1–5, A2a, A3a; BR113</tspan></text><rect x="30" y="98" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="2785" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: Moderator hợp lệ, đã chọn content feedback. Chỉ đọc, không đổi ticket status. UC-49 dẫn UC-95 nhưng màn hình danh sách là UC-48.</tspan></text><rect x="2179" y="895" width="12" height="105" fill="white" stroke="black"/><rect x="2589" y="1105" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="1699" width="12" height="45" fill="white" stroke="black"/><rect x="551" y="1824" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1920" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1940" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="1922" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="1941" text-anchor="start" font-size="15"><tspan x="135" dy="0">[có ảnh đính kèm]</tspan></text><rect x="551" y="2004" width="12" height="45" fill="white" stroke="black"/><rect x="125" y="2105" width="2675" height="28" fill="white" stroke="none"/><text x="133" y="2124" text-anchor="start" font-size="15"><tspan x="133" dy="0">[không có ảnh — A2a]</tspan></text><rect x="551" y="2185" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="2971" width="12" height="105" fill="white" stroke="black"/><rect x="25" y="3141" width="90" height="30" fill="white" stroke="black"/><text x="33" y="3161" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="3143" width="2675" height="28" fill="white" stroke="none"/><text x="135" y="3162" text-anchor="start" font-size="15"><tspan x="135" dy="0">[học liệu khả dụng]</tspan></text>