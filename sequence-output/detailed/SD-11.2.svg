<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4086" viewBox="0 0 3255 4086"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4031" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="435" width="3205" height="1365" fill="none" stroke="black"/><rect x="39" y="1140" width="3177" height="615" fill="none" stroke="black"/><rect x="25" y="2645" width="3205" height="541" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Student</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Chơi game và xem kết quả</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Đánh giá và hoàn thành game</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">game / quy tắc thưởng</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">game_session</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">Coin_EXP_Transaction_Ledger</tspan></text><rect x="50" y="355" width="3155" height="50" fill="white" stroke="none"/><text x="58" y="385" text-anchor="start" font-size="15"><tspan x="58" dy="0">Tiền điều kiện: game được khởi tạo ở SD-11.1. SRS không quy định mỗi thao tác game có phải gọi server hay không; các lời gọi ở đây diễn tả trách nhiệm logic.</tspan></text><rect x="50" y="2805" width="3155" height="50" fill="white" stroke="black"/><path d="M25,2990L3230,2990" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="522" width="12" height="3440" fill="white" stroke="black"/><rect x="949" y="1882" width="12" height="1810" fill="white" stroke="black"/><rect x="1359" y="1987" width="12" height="1600" fill="white" stroke="black"/><rect x="1769" y="627" width="12" height="2855" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-11.2 Answer &amp; complete game session</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-24 NF15–21, A1–A2; BR40, BR66, BR68–72; NS-08</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Không tự đặt luật game, công thức điểm, điều kiện kết thúc hoặc số coin: dùng cấu hình mà UC-24 / BR66 / BR68–69 dẫn chiếu.</tspan></text><rect x="25" y="435" width="90" height="30" fill="white" stroke="black"/><text x="33" y="455" text-anchor="start" font-size="15"><tspan x="33" dy="0">loop</tspan></text><rect x="127" y="437" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="456" text-anchor="start" font-size="15"><tspan x="135" dy="0">[chưa đạt điều kiện kết thúc game — UC-24 NF15–17]</tspan></text><rect x="1781" y="729" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="834" width="12" height="45" fill="white" stroke="black"/><rect x="39" y="1140" width="90" height="30" fill="white" stroke="black"/><text x="47" y="1160" text-anchor="start" font-size="15"><tspan x="47" dy="0">break</tspan></text><rect x="141" y="1142" width="3057" height="28" fill="white" stroke="none"/><text x="149" y="1161" text-anchor="start" font-size="15"><tspan x="149" dy="0">[Student thoát trước khi game hoàn thành — A2 / BR66]</tspan></text><rect x="1781" y="1434" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="2194" width="12" height="45" fill="white" stroke="black"/><rect x="2179" y="2350" width="12" height="105" fill="white" stroke="black"/><rect x="1781" y="2549" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="2645" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2665" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2647" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="2666" text-anchor="start" font-size="15"><tspan x="135" dy="0">[thỏa điều kiện thưởng]</tspan></text><rect x="50" y="2805" width="75" height="28" fill="white" stroke="black"/><text x="58" y="2824" text-anchor="start" font-size="15"><tspan x="58" dy="0">ref</tspan></text><rect x="140" y="2809" width="3045" height="28" fill="white" stroke="none"/><text x="148" y="2828" text-anchor="start" font-size="15"><tspan x="148" dy="0">SD-13.2 — Award coins: ACID, khóa idempotency, BR40</tspan></text><rect x="2999" y="2740" width="12" height="185" fill="white" stroke="black"/><rect x="125" y="2995" width="3085" height="28" fill="white" stroke="none"/><text x="133" y="3014" text-anchor="start" font-size="15"><tspan x="133" dy="0">[không thỏa điều kiện thưởng — UC-24 A1]</tspan></text><rect x="1781" y="3075" width="12" height="45" fill="white" stroke="black"/><rect x="2589" y="3256" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="3790" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="490" width="378" height="28" fill="white" stroke="none"/><text x="340" y="509" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Trả lời / tương tác theo luật game</tspan></text><path d="M142,530L538,530" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="595" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="614" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">2: Chuyển thao tác để kiểm tra theo luật game</tspan></text><path d="M552,635L1768,635" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="700" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="719" text-anchor="start" font-size="15"><tspan x="1899" dy="0">3: Kiểm tra thao tác của</tspan><tspan x="1899" dy="20">Student</tspan></text><path d="M1782,734h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="825" width="275" height="28" fill="white" stroke="none"/><text x="1899" y="844" text-anchor="start" font-size="15"><tspan x="1899" dy="0">4: Cập nhật điểm hiện tại</tspan></text><path d="M1782,839h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="930" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="949" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">5: Kết quả thao tác và điểm hiện tại</tspan></text><path d="M1768,970L552,970" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1035" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1054" text-anchor="middle" font-size="15"><tspan x="340" dy="0">6: Hiển thị trạng thái game</tspan></text><path d="M538,1075L142,1075" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1195" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1214" text-anchor="middle" font-size="15"><tspan x="340" dy="0">7: Thoát game</tspan></text><path d="M142,1235L538,1235" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1300" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="1319" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">8: Kết thúc phiên game hiện tại</tspan></text><path d="M552,1340L1768,1340" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="1405" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="1424" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Không cấp phần thưởng hoàn</tspan><tspan x="1899" dy="20">thành</tspan></text><path d="M1782,1439h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="561" y="1530" width="1198" height="28" fill="white" stroke="none"/><text x="1160" y="1549" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">10: Phiên kết thúc</tspan></text><path d="M1768,1570L552,1570" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="151" y="1635" width="378" height="28" fill="white" stroke="none"/><text x="340" y="1654" text-anchor="middle" font-size="15"><tspan x="340" dy="0">11: Rời giao diện game</tspan></text><path d="M538,1675L142,1675" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="1830" width="378" height="48" fill="white" stroke="none"/><text x="750" y="1849" text-anchor="middle" font-size="15"><tspan x="750" dy="0">12: Hoàn thành game khi đạt điều kiện kết</tspan><tspan x="750" dy="20">thúc</tspan></text><path d="M552,1890L948,1890" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="1955" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1974" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">13: Chuyển yêu cầu hoàn thành phiên</tspan></text><path d="M962,1995L1358,1995" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="2060" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="2079" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">14: Xử lý game đã hoàn thành</tspan></text><path d="M1372,2100L1768,2100" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="2165" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="2184" text-anchor="start" font-size="15"><tspan x="1899" dy="0">15: Tính điểm cuối cùng và số</tspan><tspan x="1899" dy="20">câu trả lời đúng — BR66</tspan></text><path d="M1782,2199h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2290" width="378" height="48" fill="white" stroke="none"/><text x="1980" y="2309" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">16: Đọc điều kiện và mức thưởng được cấu</tspan><tspan x="1980" dy="20">hình</tspan></text><path d="M1782,2350L2178,2350" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2415" width="378" height="28" fill="white" stroke="none"/><text x="1980" y="2434" text-anchor="middle" font-size="15"><tspan x="1980" dy="0">17: Điều kiện / số coin theo cấu hình</tspan></text><path d="M2178,2455L1782,2455" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="2520" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="2539" text-anchor="start" font-size="15"><tspan x="1899" dy="0">18: Đối chiếu điều kiện thưởng</tspan><tspan x="1899" dy="20">— BR68–69</tspan></text><path d="M1782,2554h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2700" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2719" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">19: Cấp thưởng một lần cho hoạt động hoàn thành</tspan></text><path d="M1782,2740L2998,2740" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="2885" width="1198" height="28" fill="white" stroke="none"/><text x="2390" y="2904" text-anchor="middle" font-size="15"><tspan x="2390" dy="0">20: Coin được thưởng theo kết quả ledger</tspan></text><path d="M2998,2925L1782,2925" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1891" y="3046" width="275" height="48" fill="white" stroke="none"/><text x="1899" y="3065" text-anchor="start" font-size="15"><tspan x="1899" dy="0">21: Không cấp coin; vẫn lưu và</tspan><tspan x="1899" dy="20">hiển thị kết quả</tspan></text><path d="M1782,3080h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3216" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3235" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">22: Lưu game, scope, score, correct count, coins earned và incorrectly answered questions</tspan></text><path d="M1782,3256L2588,3256" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1791" y="3321" width="788" height="28" fill="white" stroke="none"/><text x="2185" y="3340" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">23: Kết quả game đã lưu — BR71</tspan></text><path d="M2588,3361L1782,3361" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="1381" y="3426" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="3445" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">24: Kết quả hoàn thành và dữ liệu review</tspan></text><path d="M1768,3466L1372,3466" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="971" y="3531" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="3550" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">25: Kết quả hoàn thành và dữ liệu review</tspan></text><path d="M1358,3571L962,3571" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="3636" width="378" height="28" fill="white" stroke="none"/><text x="750" y="3655" text-anchor="middle" font-size="15"><tspan x="750" dy="0">26: Kết quả hoàn thành và dữ liệu review</tspan></text><path d="M948,3676L552,3676" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="661" y="3741" width="275" height="68" fill="white" stroke="none"/><text x="669" y="3760" text-anchor="start" font-size="15"><tspan x="669" dy="0">27: Hiển thị Student answers,</tspan><tspan x="669" dy="20">câu sai và giải thích có sẵn —</tspan><tspan x="669" dy="20">BR72</tspan></text><path d="M552,3795h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="3886" width="378" height="48" fill="white" stroke="none"/><text x="340" y="3905" text-anchor="middle" font-size="15"><tspan x="340" dy="0">28: Hiển thị điểm cuối cùng, số câu đúng</tspan><tspan x="340" dy="20">và coin nhận được</tspan></text><path d="M538,3946L142,3946" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/></g></svg>