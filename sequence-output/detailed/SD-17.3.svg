<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4291" viewBox="0 0 3255 4291"><defs><marker id="block" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="black"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><path d="M135,315L135,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M545,315L545,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M955,315L955,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1365,315L1365,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M1775,315L1775,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2185,315L2185,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M2595,315L2595,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><path d="M3005,315L3005,4236" fill="none" stroke="#999999" stroke-dasharray="7 6" /><rect x="25" y="730" width="3205" height="195" fill="none" stroke="black"/><rect x="25" y="1540" width="3205" height="490" fill="none" stroke="black"/><rect x="25" y="2205" width="3205" height="1981" fill="none" stroke="black"/><circle cx="135" cy="229" r="9" fill="white" stroke="black"/><path d="M135,238v23 m-19,-15h38 m-19,15l-18,18 m18,-18l18,18" fill="none" stroke="black"/><text x="135" y="304" text-anchor="middle" font-size="15">Moderator</text><rect x="385" y="220" width="320" height="85" fill="white" stroke="black"/><text x="545" y="247.5" text-anchor="middle" font-size="15"><tspan x="545" dy="0">«boundary»</tspan><tspan x="545" dy="20">Xử lý feedback nội dung</tspan><tspan x="545" dy="20">React UI</tspan></text><rect x="795" y="220" width="320" height="85" fill="white" stroke="black"/><text x="955" y="247.5" text-anchor="middle" font-size="15"><tspan x="955" dy="0">«module»</tspan><tspan x="955" dy="20">Giao tiếp API</tspan><tspan x="955" dy="20">React client</tspan></text><rect x="1205" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1365" y="247.5" text-anchor="middle" font-size="15"><tspan x="1365" dy="0">«control»</tspan><tspan x="1365" dy="20">Tiếp nhận yêu cầu</tspan><tspan x="1365" dy="20">Spring Boot API</tspan></text><rect x="1615" y="220" width="320" height="85" fill="white" stroke="black"/><text x="1775" y="247.5" text-anchor="middle" font-size="15"><tspan x="1775" dy="0">«control»</tspan><tspan x="1775" dy="20">Kiểm tra và cập nhật feedback</tspan><tspan x="1775" dy="20">Trách nhiệm nghiệp vụ</tspan></text><rect x="2025" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2185" y="257.5" text-anchor="middle" font-size="15"><tspan x="2185" dy="0">«entity»</tspan><tspan x="2185" dy="20">feedback</tspan></text><rect x="2435" y="220" width="320" height="85" fill="white" stroke="black"/><text x="2595" y="257.5" text-anchor="middle" font-size="15"><tspan x="2595" dy="0">«entity»</tspan><tspan x="2595" dy="20">notification</tspan></text><rect x="2845" y="220" width="320" height="85" fill="white" stroke="black"/><text x="3005" y="257.5" text-anchor="middle" font-size="15"><tspan x="3005" dy="0">«entity»</tspan><tspan x="3005" dy="20">Email Service</tspan></text><path d="M25,2945L3230,2945" fill="none" stroke="black" stroke-dasharray="7 6" /><rect x="539" y="407" width="12" height="3715" fill="white" stroke="black"/><rect x="949" y="987" width="12" height="2885" fill="white" stroke="black"/><rect x="1359" y="1092" width="12" height="2655" fill="white" stroke="black"/><rect x="1769" y="1322" width="12" height="2300" fill="white" stroke="black"/><rect x="30" y="10" width="3195" height="38" fill="white" stroke="none"/><text x="38" y="39" text-anchor="start" font-size="25"><tspan x="38" dy="0">SD-17.3 Process content feedback</tspan></text><rect x="30" y="58" width="3195" height="28" fill="white" stroke="none"/><text x="38" y="77" text-anchor="start" font-size="15"><tspan x="38" dy="0">Nguồn: UC-50 NF1–9, A3a, A4a; BR115, BR144–145</tspan></text><rect x="30" y="98" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="116" text-anchor="start" font-size="14"><tspan x="38" dy="0">Mô hình tương tác logic từ SRS. Boundary / API / control là phân rã trách nhiệm UML; không khẳng định tên file, lớp, method, endpoint hay mã HTTP mà SRS không quy định.</tspan></text><rect x="30" y="130" width="3195" height="27" fill="white" stroke="none"/><text x="38" y="148" text-anchor="start" font-size="14"><tspan x="38" dy="0">Tiền điều kiện: Moderator hợp lệ; ticket đang Chờ xử lý / Đang xử lý. UC-50 không mô tả lỗi gửi email; không áp dụng nhánh lỗi email của UC-64 sang đây.</tspan></text><rect x="551" y="634" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="730" width="90" height="30" fill="white" stroke="black"/><text x="33" y="750" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="732" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="751" text-anchor="start" font-size="15"><tspan x="135" dy="0">[Đã xử lý / Từ chối mà ghi chú trống — A3a]</tspan></text><rect x="1371" y="1194" width="12" height="45" fill="white" stroke="black"/><rect x="1781" y="1444" width="12" height="45" fill="white" stroke="black"/><rect x="25" y="1540" width="90" height="30" fill="white" stroke="black"/><text x="33" y="1560" text-anchor="start" font-size="15"><tspan x="33" dy="0">break</tspan></text><rect x="127" y="1542" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="1561" text-anchor="start" font-size="15"><tspan x="135" dy="0">[dữ liệu ràng buộc không hợp lệ — NF5 / A3a]</tspan></text><rect x="25" y="2205" width="90" height="30" fill="white" stroke="black"/><text x="33" y="2225" text-anchor="start" font-size="15"><tspan x="33" dy="0">alt</tspan></text><rect x="127" y="2207" width="3085" height="28" fill="white" stroke="none"/><text x="135" y="2226" text-anchor="start" font-size="15"><tspan x="135" dy="0">[ticket vừa được Moderator khác cập nhật — A4a]</tspan></text><rect x="2179" y="2140" width="12" height="160" fill="white" stroke="black"/><rect x="125" y="2950" width="3085" height="28" fill="white" stroke="none"/><text x="133" y="2969" text-anchor="start" font-size="15"><tspan x="133" dy="0">[cập nhật thành công]</tspan></text><rect x="2589" y="3166" width="12" height="105" fill="white" stroke="black"/><rect x="2999" y="3376" width="12" height="105" fill="white" stroke="black"/><rect x="551" y="3970" width="12" height="45" fill="white" stroke="black"/><rect x="151" y="355" width="378" height="48" fill="white" stroke="none"/><text x="340" y="374" text-anchor="middle" font-size="15"><tspan x="340" dy="0">1: Xem báo lỗi; chọn Đang xử lý / Đã xử lý</tspan><tspan x="340" dy="20">/ Từ chối</tspan></text><path d="M142,415L538,415" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="480" width="378" height="48" fill="white" stroke="none"/><text x="340" y="499" text-anchor="middle" font-size="15"><tspan x="340" dy="0">2: Nhập “Ghi chú xử lý”; nhấn “Xác nhận xử</tspan><tspan x="340" dy="20">lý”</tspan></text><path d="M142,540L538,540" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="661" y="605" width="275" height="48" fill="white" stroke="none"/><text x="669" y="624" text-anchor="start" font-size="15"><tspan x="669" dy="0">3: Trim và kiểm tra dữ liệu</tspan><tspan x="669" dy="20">nhập phía client — §5.2.2</tspan></text><path d="M552,639h88v30H558" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="151" y="785" width="378" height="48" fill="white" stroke="none"/><text x="340" y="804" text-anchor="middle" font-size="15"><tspan x="340" dy="0">4: Tô đỏ ghi chú; yêu cầu nhập ghi chú chi</tspan><tspan x="340" dy="20">tiết; dừng lưu</tspan></text><path d="M538,845L142,845" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="561" y="955" width="378" height="28" fill="white" stroke="none"/><text x="750" y="974" text-anchor="middle" font-size="15"><tspan x="750" dy="0">5: Gửi trạng thái mới và ghi chú xử lý</tspan></text><path d="M552,995L948,995" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="971" y="1060" width="378" height="28" fill="white" stroke="none"/><text x="1160" y="1079" text-anchor="middle" font-size="15"><tspan x="1160" dy="0">6: Chuyển yêu cầu kèm phiên Moderator</tspan></text><path d="M962,1100L1358,1100" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1481" y="1165" width="275" height="48" fill="white" stroke="none"/><text x="1489" y="1184" text-anchor="start" font-size="15"><tspan x="1489" dy="0">7: Validate / sanitize input</tspan><tspan x="1489" dy="20">phía server — §5.2.2</tspan></text><path d="M1372,1199h88v30H1378" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1290" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1309" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">8: Xử lý cập nhật content feedback</tspan></text><path d="M1372,1330L1768,1330" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1891" y="1395" width="275" height="68" fill="white" stroke="none"/><text x="1899" y="1414" text-anchor="start" font-size="15"><tspan x="1899" dy="0">9: Kiểm tra chuyển trạng thái</tspan><tspan x="1899" dy="20">hợp lệ và ghi chú bắt buộc khi</tspan><tspan x="1899" dy="20">hoàn thành / từ chối</tspan></text><path d="M1782,1449h88v30H1788" fill="none" stroke="black"  marker-end="url(#block)"/><rect x="1381" y="1595" width="378" height="28" fill="white" stroke="none"/><text x="1570" y="1614" text-anchor="middle" font-size="15"><tspan x="1570" dy="0">10: Yêu cầu sửa thông tin; không lưu</tspan></text><path d="M1768,1635L1372,1635" fill="none" stroke="black" stroke-dasharray="7 6" marker-end="url(#open)"/><rect x="97